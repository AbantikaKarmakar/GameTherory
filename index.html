/* Layout concept: persistent left rail + dense multi-panel workspace; dark strategy-lab look, cyan = you, violet = opponent/analysis, amber = equilibrium. */
:root{
  --bg:#0B1020; --s1:#121A2B; --s2:#172238; --s3:#1d2b47;
  --line:rgba(167,178,200,.16); --line2:rgba(167,178,200,.28);
  --cy:#45E6E0; --vi:#9B7BFF; --am:#FFCA72; --ok:#3DDC97; --red:#FF7070;
  --tx:#F3F5FC; --tx2:#A7B2C8; --tx3:#7F8CA6;
  --cy-bg:rgba(69,230,224,.12); --vi-bg:rgba(155,123,255,.14); --am-bg:rgba(255,202,114,.14); --red-bg:rgba(255,112,112,.13); --ok-bg:rgba(61,220,151,.13);
  --f-d:'Space Grotesk','Segoe UI',system-ui,sans-serif; --f-b:'Inter','Segoe UI',system-ui,sans-serif; --f-m:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px; --r2:8px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 var(--f-b);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0;-webkit-font-smoothing:antialiased;
 background-image:linear-gradient(rgba(167,178,200,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(167,178,200,.045) 1px,transparent 1px);background-size:36px 36px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3,h4{font-family:var(--f-d);margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:22px;line-height:1.2} h2{font-size:16px} h3{font-size:14px} h4{font-size:12px}
p{margin:0}
a{color:var(--cy)}
button{font:inherit;color:inherit;cursor:pointer}
code,.mono{font-family:var(--f-m)}
.mono{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px;border-radius:6px}
.lbl{font:600 10.5px/1.2 var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--tx3)}
.muted{color:var(--tx2)} .dim{color:var(--tx3)} .sm{font-size:12px} .xs{font-size:11px}
.cy{color:var(--cy)} .vi{color:var(--vi)} .am{color:var(--am)} .red{color:var(--red)} .ok{color:var(--ok)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0} .sp{height:6px}
.hide{display:none!important}

/* shell */
.shell{display:grid;grid-template-columns:216px minmax(0,1fr);gap:16px;max-width:1500px;margin:0 auto;padding-block:12px 90px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;max-height:calc(100vh - 24px - env(safe-area-inset-top,0px));overflow:auto;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:9px;padding:2px 4px 8px}
.brand svg{flex:none}
.brand b{font:700 17px var(--f-d);letter-spacing:.14em}
.brand small{display:block;font-size:10px;color:var(--tx3);letter-spacing:.04em;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid transparent;background:none;border-radius:8px;color:var(--tx2);text-align:left;width:100%;transition:background .15s,color .15s}
.nav button:hover{background:var(--s2);color:var(--tx)}
.nav button[aria-current=page]{background:var(--cy-bg);color:var(--cy);border-color:rgba(69,230,224,.28)}
.nav svg{width:17px;height:17px;flex:none}
.prof{margin-top:auto;border-top:1px solid var(--line);padding-top:10px}
.bar{height:6px;border-radius:4px;background:var(--s3);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--vi));border-radius:4px;transition:width .5s}
.main{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;gap:8px;align-items:center;padding:8px 0;background:linear-gradient(var(--bg) 70%,transparent);margin-bottom:6px}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--tx3);text-align:left}
.search kbd{margin-left:auto;font:11px var(--f-m);border:1px solid var(--line2);border-radius:5px;padding:0 5px;color:var(--tx2)}
.ib{display:inline-flex;align-items:center;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--tx2);transition:border-color .15s,color .15s}
.ib:hover{color:var(--tx);border-color:var(--line2)}
.ib[aria-pressed=true]{color:var(--cy);border-color:rgba(69,230,224,.4);background:var(--cy-bg)}
.ib svg,.btn svg{width:16px;height:16px;flex:none}
.menu-btn{display:none}
.page{display:flex;flex-direction:column;gap:14px}.page.enter{animation:rise .35s ease both}
@keyframes rise{from{opacity:.55;transform:translateY(8px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph p{color:var(--tx2);max-width:68ch;margin-top:3px}

/* surfaces */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.hi{background:var(--s2)}
.glass{background:rgba(23,34,56,.82);backdrop-filter:blur(10px);border:1px solid var(--line2);border-radius:var(--r)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.split-eq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--s2);color:var(--tx);padding:8px 14px;border-radius:9px;font-weight:600;transition:transform .1s,background .15s,border-color .15s,box-shadow .15s}
.btn:hover{background:var(--s3);border-color:var(--tx3)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn.pri{background:linear-gradient(135deg,var(--cy),#2fc3d8);color:#06222a;border-color:transparent}
.btn.pri:hover{box-shadow:0 0 0 3px rgba(69,230,224,.22);background:linear-gradient(135deg,#6af0ea,#3fd0e3)}
.btn.vi{background:var(--vi-bg);border-color:rgba(155,123,255,.4);color:#cfc2ff}
.btn.am{background:var(--am-bg);border-color:rgba(255,202,114,.4);color:var(--am)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.ghost{background:none}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--f-b);padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--tx2);white-space:nowrap}
.chip.cy{color:var(--cy);background:var(--cy-bg);border-color:rgba(69,230,224,.3)} .chip.vi{color:#c3b3ff;background:var(--vi-bg);border-color:rgba(155,123,255,.35)}
.chip.am{color:var(--am);background:var(--am-bg);border-color:rgba(255,202,114,.35)} .chip.red{color:var(--red);background:var(--red-bg);border-color:rgba(255,112,112,.35)} .chip.ok{color:var(--ok);background:var(--ok-bg);border-color:rgba(61,220,151,.35)}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--tx2);padding:6px 11px;border-radius:7px;font-weight:600;font-size:12.5px;white-space:nowrap}
.seg button:hover{color:var(--tx)}
.seg button[aria-selected=true],.seg button[aria-pressed=true]{background:var(--s3);color:var(--cy);box-shadow:inset 0 0 0 1px rgba(69,230,224,.3)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs button{border:0;background:none;color:var(--tx2);padding:9px 13px;font-weight:600;font-size:13px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--tx)}
.tabs button[aria-selected=true]{color:var(--cy);border-color:var(--cy)}
input[type=text],input[type=number],textarea,select{background:var(--bg);border:1px solid var(--line2);color:var(--tx);border-radius:8px;padding:7px 9px;font:inherit;width:100%}
textarea{resize:vertical;min-height:64px}
input[aria-invalid=true]{border-color:var(--red);background:var(--red-bg)}
input[type=range]{width:100%;accent-color:var(--cy);height:24px}
details{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
details>summary{cursor:pointer;padding:8px 12px;font-weight:600;color:var(--tx2);list-style:none;display:flex;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";color:var(--tx3);transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
details>div{padding:2px 12px 12px;color:var(--tx2)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:center;background:radial-gradient(900px 300px at 85% 0,rgba(155,123,255,.16),transparent 60%),radial-gradient(700px 300px at 0 100%,rgba(69,230,224,.11),transparent 60%),var(--s1);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.hero h1{font-size:clamp(26px,3.4vw,38px);line-height:1.08;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{color:var(--tx2);margin-top:10px;max-width:52ch;font-size:14.5px}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font:600 11px var(--f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--am);margin-bottom:8px}
.hero svg:not(.ic){width:100%;height:auto;max-height:300px}
.ring{transform-origin:center;transform-box:fill-box;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.flow{stroke-dasharray:6 8;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}

/* tiles */
.tile{position:relative;text-align:left;display:flex;flex-direction:column;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px;transition:transform .15s,border-color .15s,background .15s;min-width:0}
.tile:hover{transform:translateY(-2px);border-color:rgba(69,230,224,.45);background:var(--s2)}
.tile h3{font-size:14.5px}
.tile .meta{display:flex;gap:6px;flex-wrap:wrap}
.mini{display:grid;gap:3px;font:11px var(--f-m)}
.mini div{border:1px solid var(--line);border-radius:5px;padding:3px 4px;text-align:center;background:var(--bg);white-space:nowrap}
.mini .ne{border-color:var(--am);background:var(--am-bg);color:var(--am);font-weight:600}
.stat{display:flex;flex-direction:column;gap:1px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.stat b{font:600 20px var(--f-m);color:var(--tx)}

/* payoff matrix */
.mx-wrap{overflow-x:auto;padding:2px}
.mx{display:grid;gap:5px;min-width:min(100%,300px);align-items:stretch}
.mx .corner{font-size:10.5px;line-height:1.25;color:var(--tx3);display:flex;flex-direction:column;justify-content:flex-end;padding:2px}
.mx .ch,.mx .rh{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;font-size:12.5px;padding:6px 4px;border-radius:7px;min-width:0;overflow-wrap:anywhere}
.mx .ch{color:#cdbfff;background:var(--vi-bg);border:1px solid rgba(155,123,255,.28)}
.mx .rh{color:var(--cy);background:var(--cy-bg);border:1px solid rgba(69,230,224,.28)}
.mx .ch.pick,.mx .rh.pick{box-shadow:0 0 0 2px currentColor}
.cell{position:relative;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:72px;min-width:0;transition:background .2s,border-color .2s,box-shadow .25s,transform .2s}
.cell.click{cursor:pointer} .cell.click:hover{border-color:var(--tx3);background:var(--s2)}
.pay{font:600 19px var(--f-m);display:flex;gap:6px;align-items:baseline;font-variant-numeric:tabular-nums}
.pay .a{color:var(--cy)} .pay .b{color:#b9a6ff} .pay i{color:var(--tx3);font-style:normal;font-weight:400}
.cell input{width:100%;min-width:0;text-align:center;font:600 15px var(--f-m);padding:5px 2px}
.cell input.a{color:var(--cy)} .cell input.b{color:#b9a6ff}
.cell .ins{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%}
.flags{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:15px}
.flags b{font:700 9.5px var(--f-m);padding:1px 5px;border-radius:4px;letter-spacing:.03em}
.flags .f1{color:var(--cy);background:var(--cy-bg);border:1px solid rgba(69,230,224,.35)}
.flags .f2{color:#c3b3ff;background:var(--vi-bg);border:1px solid rgba(155,123,255,.4)}
.flags .fn{color:#1b1300;background:var(--am)} .flags .fp{color:var(--ok);background:var(--ok-bg);border:1px solid rgba(61,220,151,.4)}
.cell.br1{box-shadow:inset 0 -3px 0 var(--cy)} .cell.br2{box-shadow:inset -3px 0 0 var(--vi)}
.cell.br1.br2{box-shadow:inset 0 -3px 0 var(--cy),inset -3px 0 0 var(--vi)}
.cell.ne{border-color:var(--am);background:linear-gradient(160deg,rgba(255,202,114,.16),rgba(255,202,114,.04));animation:pulse 1.3s ease-out 2}
.cell.neq{border-color:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,202,114,.55)}100%{box-shadow:0 0 0 14px rgba(255,202,114,0)}}
.cell.sel{outline:2px solid var(--tx);outline-offset:1px}
.cell.last{border-color:var(--cy);background:var(--cy-bg);transform:scale(1.03)}
.cell.dim{opacity:.55}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--tx2)}
.legend span{display:inline-flex;gap:5px;align-items:center}

/* game bits */
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px;border-radius:12px;border:1px solid rgba(69,230,224,.35);background:var(--cy-bg);font:600 15px var(--f-d);color:var(--tx);transition:transform .12s,background .15s,box-shadow .15s}
.choice button:hover:not(:disabled){background:rgba(69,230,224,.2);transform:translateY(-1px)}
.choice button:disabled{opacity:.5;cursor:not-allowed}
.choice button.picked{box-shadow:0 0 0 3px var(--cy);background:rgba(69,230,224,.24)}
.choice small{font:400 11.5px var(--f-b);color:var(--tx2)}
.opp{display:flex;flex-direction:column;gap:6px}
.opp button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 10px;transition:border-color .15s,background .15s}
.opp button:hover{border-color:var(--line2)}
.opp button[aria-pressed=true]{border-color:rgba(155,123,255,.7);background:var(--vi-bg)}
.opp button b{display:block;font-size:13px} .opp button span{font-size:11.5px;color:var(--tx2)}
.opp button:disabled{opacity:.45;cursor:not-allowed}
.reveal{display:flex;align-items:center;justify-content:center;gap:14px;min-height:84px;border:1px dashed var(--line2);border-radius:12px;padding:10px;text-align:center}
.flip{display:inline-block;animation:flip .55s ease both}
@keyframes flip{from{transform:rotateX(90deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
.who{padding:8px 14px;border-radius:10px;font:600 14px var(--f-d)}
.who.me{background:var(--cy-bg);color:var(--cy);border:1px solid rgba(69,230,224,.35)}
.who.them{background:var(--vi-bg);color:#c3b3ff;border:1px solid rgba(155,123,255,.4)}
.count{font:700 44px var(--f-m);color:var(--am);animation:pop .5s ease both}
@keyframes pop{from{transform:scale(1.6);opacity:0}to{transform:none;opacity:1}}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font:600 10.5px var(--f-b);letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:5px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t td.n,table.t th.n{text-align:right;font-family:var(--f-m)}
.scroll{overflow:auto;max-height:240px;border:1px solid var(--line);border-radius:10px}
.scroll.tall{max-height:none}
.meter{position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--ok),var(--am),var(--red));overflow:visible}
.meter i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--tx);box-shadow:0 0 0 2px var(--bg);transition:left .5s}
.out{border:1px solid rgba(255,202,114,.35);background:linear-gradient(160deg,rgba(255,202,114,.09),transparent 55%),var(--s2);border-radius:14px;padding:16px;animation:rise .4s ease both}
.callout{border-left:3px solid var(--vi);background:var(--vi-bg);padding:9px 12px;border-radius:0 8px 8px 0;color:var(--tx)}
.callout.am{border-color:var(--am);background:var(--am-bg)} .callout.cy{border-color:var(--cy);background:var(--cy-bg)} .callout.red{border-color:var(--red);background:var(--red-bg)} .callout.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line2);background:var(--bg);border-radius:9px;padding:8px 11px;margin-top:6px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--tx3)}
.opt.good{border-color:var(--ok);background:var(--ok-bg)} .opt.bad{border-color:var(--red);background:var(--red-bg)}
.opt:disabled{cursor:default}
svg text{font-family:var(--f-m);fill:var(--tx2);font-size:11px}
svg .t2{fill:var(--tx3)}
.ch-card svg{width:100%;height:auto;display:block}

/* concept list */
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.cc{text-align:left;border:1px solid var(--line);background:var(--s1);border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,background .15s}
.cc:hover{border-color:var(--line2);background:var(--s2)}
.cc.done{border-color:rgba(61,220,151,.4)}
.cc small{color:var(--tx2);font-size:12px}

/* chat */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:99px;border:1px solid rgba(155,123,255,.5);background:linear-gradient(135deg,#7b5cff,#9B7BFF);color:#fff;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.fab svg{width:18px;height:18px}
.chat{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;width:min(400px,calc(100vw - 32px));height:min(600px,calc(100vh - 90px));display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
.chat.inline{position:static;width:100%;height:min(620px,calc(100vh - 150px));min-height:420px;box-shadow:none;animation:none;z-index:auto}
.ch-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:92%;padding:8px 11px;border-radius:12px;font-size:13px;line-height:1.5}
.m.bot{background:var(--s2);border:1px solid var(--line);align-self:flex-start}
.m.me{background:var(--cy-bg);border:1px solid rgba(69,230,224,.3);align-self:flex-end}
.m p+p{margin-top:6px} .m ul{margin:4px 0 0 16px;padding:0}
.m .src{display:block;margin-top:6px;font-size:10.5px;color:var(--tx3)}
.qp{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}
.qp button{border:1px solid var(--line2);background:var(--bg);border-radius:99px;padding:4px 10px;font-size:12px;color:var(--tx2)}
.qp button:hover{color:var(--tx);border-color:var(--tx3)}
.ch-in{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(5,8,18,.7);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:max(12vh,calc(env(safe-area-inset-top,0px) + 20px)) 16px 16px}
.pal{width:min(560px,100%);overflow:hidden}
.pal input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:13px 14px;font-size:15px;background:transparent}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.pal li button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;color:var(--tx)}
.pal li button[aria-selected=true],.pal li button:hover{background:var(--s3)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--s3);border:1px solid rgba(255,202,114,.5);color:var(--tx);padding:9px 16px;border-radius:99px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:rise .3s ease both;font-weight:600}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:85;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.drawer-bg{display:none}

/* present mode */
body.present .side{display:none} body.present .shell{grid-template-columns:minmax(0,1fr);max-width:1700px}
body.present{font-size:17px} body.present .pay{font-size:28px} body.present .mx .ch,body.present .mx .rh{font-size:16px}
body.present .cell{min-height:100px} body.present .fab{display:none} body.present .top .search{display:none}
body.present .lbl{font-size:12px}
.nomotion *,.nomotion *::before,.nomotion *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:70;width:min(280px,84vw);max-height:none;border-radius:0 14px 14px 0;transform:translateX(-105%);transition:transform .25s;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px))}
  .side.open{transform:none}
  .drawer-bg.open{display:block;position:fixed;inset:0;z-index:65;background:rgba(5,8,18,.6)}
  .menu-btn{display:inline-flex}
  .hero{grid-template-columns:minmax(0,1fr);padding:16px}
  .split-eq,.g2{grid-template-columns:minmax(0,1fr)}
  .top .search kbd{display:none}
}
@media (max-width:560px){.g3,.g4{grid-template-columns:minmax(0,1fr)}.pay{font-size:16px}.cell{min-height:62px;padding:8px 4px}.choice button{padding:12px 6px}}
.learn{display:grid;grid-template-columns:minmax(230px,300px) minmax(0,1fr);gap:14px;align-items:start}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:900px){.learn{grid-template-columns:minmax(0,1fr)}}
.flags .fm{color:var(--tx);background:var(--s3);border:1px solid var(--tx3)}
[hidden]{display:none!important}
.ic{width:16px;height:16px;flex:none}
.nav .ic{width:17px;height:17px}.fab .ic{width:18px;height:18px}.eyebrow .ic{width:14px;height:14px}
.ch-card{max-width:580px}.ch-card svg{max-width:100%}
.qp{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}.qp button{white-space:nowrap;flex:none}
.hsplit{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1100px){.hsplit{grid-template-columns:minmax(0,1fr)}}

.search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.fab span{display:none}.fab{padding:12px}.top .ib span{display:none}.search{min-width:0}}
.tw{overflow-x:auto}

.btn.big{font-size:1.1em;padding:12px 22px;min-height:48px}
.btn[aria-pressed=true]{border-color:var(--cy);color:var(--cy);background:var(--cy-bg)}
.cls select{min-width:170px}
body.present .cls .cell{min-height:130px} body.present .cls .pay{font-size:36px}
body.present .cls .mx .ch,body.present .cls .mx .rh{font-size:20px}
.cls .card{min-width:0}
.doc{max-width:860px} .doc h2{font-size:22px;margin:18px 0 6px} .doc h3{font-size:17px;margin:16px 0 6px} .doc h4{font-size:15px;margin:12px 0 4px}
.doc p,.doc li{color:var(--tx2);line-height:1.6} .doc p{margin:8px 0} .doc ul,.doc ol{margin:6px 0 6px 20px;padding:0}
.doc code{font-family:var(--f-m);font-size:.9em;background:var(--bg);padding:1px 5px;border-radius:5px;color:var(--tx)}
.doc pre.code{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;margin:8px 0} .doc pre.code code{background:none;padding:0}
.doc a{color:var(--cy)}

/* ================= FOUR-CARD DUEL ================= */
.btn.red{background:var(--red-bg);border-color:rgba(255,112,112,.4);color:var(--red)}
.rc{color:#FF7A7A} .bc{color:#d6dcec} h2.red{color:#FF7A7A} h2.black{color:#e8ecf7}
.duel-h{font-size:clamp(18px,3.2vw,26px);letter-spacing:.01em}
/* the card */

/* ================= SITE-WIDE POLISH ================= */

.modal{width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;padding:22px;border-radius:16px;border:1px solid var(--line2);background:var(--s1);box-shadow:0 24px 70px rgba(0,0,0,.55)}
.tt{border-bottom:1px dotted var(--cy);cursor:help;position:relative;color:inherit}
.tt::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,4px);width:max-content;max-width:min(300px,70vw);background:#0b1020;color:var(--tx);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font:400 12.5px/1.45 var(--f-b);box-shadow:0 10px 30px rgba(0,0,0,.5);display:none;pointer-events:none;z-index:60;text-align:left;white-space:normal}

@keyframes ttin{from{opacity:0}} .tt:focus{outline:2px solid var(--cy);outline-offset:2px;border-radius:3px}
/* buttons: immediate press / hover feedback */

.btn:active:not(:disabled),.choice button:active:not(:disabled),.opt:active:not(:disabled){transform:translateY(1px) scale(.985)}
.btn:hover:not(:disabled){transform:translateY(-1px)} .tile:hover{transform:translateY(-2px);border-color:var(--line2)}
/* mechanic-aware motion */
.cell.ne{animation:nepulse 2.8s ease-in-out infinite} @keyframes nepulse{0%,100%{box-shadow:0 0 0 0 rgba(255,202,114,0)}50%{box-shadow:0 0 14px 1px rgba(255,202,114,.38)}}
.cell.hl{outline:1px solid rgba(69,230,224,.55);background-color:rgba(69,230,224,.07)} .cell.hlbr{box-shadow:0 0 16px rgba(69,230,224,.5);animation:none}
.bar>i{transform-origin:left;animation:bgrow .6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes bgrow{from{transform:scaleX(0)}}

.tb{animation:tbin .45s ease backwards} @keyframes tbin{from{opacity:0;transform:translateY(4px)}}

/* ================= FOUR-CARD DUEL v2: choose, lock, reveal ================= */
.duel{--gold:#d4af6a;--felt1:#0f3f3d;--felt2:#0a2a3a;--cw:clamp(64px,9.5vw,104px);--hw:clamp(56px,calc(8vw + 22px),108px);--spd:1;display:grid;gap:12px;min-width:0}
.d-top{display:grid;grid-template-columns:auto minmax(150px,1fr) auto;gap:14px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.d-title{display:flex;flex-direction:column;line-height:1.2} .d-title b{font-family:var(--f-d)}
.d-round{display:flex;flex-direction:column;gap:5px;min-width:0} .d-round b{font-size:16px;letter-spacing:.06em}
.d-prog{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)} .d-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f0d594);transition:width calc(.5s*var(--spd)) ease}
.d-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.d-score{display:grid;grid-template-columns:1fr minmax(0,auto) 1fr;gap:10px;align-items:stretch}
.sbox{position:relative;display:flex;flex-direction:column;gap:2px;padding:8px 14px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);min-width:0}
.sbox.red{border-color:rgba(255,107,107,.45);box-shadow:inset 3px 0 0 #FF6B6B} .sbox.black{border-color:rgba(214,220,236,.35);box-shadow:inset -3px 0 0 #d6dcec;text-align:right;align-items:flex-end}
.sbox .zl{text-align:left;align-self:stretch} .sbox.black .zl{text-align:right}
.sbox .big{font-size:34px;line-height:1.05} .sbox.red .big{color:#FF7A7A} .sbox.black .big{color:#e8ecf7}
.sbox .big.pop{animation:dpop calc(.5s*var(--spd)) ease} @keyframes dpop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
.smid{display:grid;grid-template-columns:repeat(4,auto);gap:4px 16px;align-items:center;justify-content:center;padding:6px 14px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);text-align:center}
.smid div{display:flex;flex-direction:column;line-height:1.25} .smid b{font:600 14px var(--f-m)} .smid .lbl{font-size:10px}
.smid .tie b{color:var(--am)}
.d-arena{position:relative;display:grid;grid-template-columns:1fr minmax(70px,130px) 1fr;gap:8px;align-items:center;padding:8px 10px 8px;border-radius:16px;border:1px solid rgba(212,175,106,.35);overflow:hidden;min-height:calc(var(--cw)*1.4 + 90px)}
.felt{background:radial-gradient(ellipse at 50% 40%,var(--felt1) 0%,var(--felt2) 70%,#07151f 100%),repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 60px rgba(0,0,0,.55),0 8px 30px rgba(0,0,0,.35)}
.d-arena.final{border-color:var(--gold);box-shadow:inset 0 0 60px rgba(0,0,0,.55),0 0 0 1px var(--gold),0 0 28px rgba(212,175,106,.28)}
.zone{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 6px;border-radius:14px;border:1px solid transparent;transition:box-shadow calc(.4s*var(--spd)),border-color calc(.4s*var(--spd)),opacity calc(.4s*var(--spd))}
.zone.red{background:linear-gradient(180deg,rgba(255,107,107,.1),transparent)} .zone.black{background:linear-gradient(180deg,rgba(214,220,236,.08),transparent)}
.zl{font:600 11px var(--f-d);letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);text-align:center} .zone.red .zl{color:#FF9A9A}
.zst{font:600 11px var(--f-d);color:var(--tx2);min-height:16px;display:inline-flex;align-items:center;gap:5px} .zst.lk{color:var(--ok)} .zst.ch{color:var(--am)}
.zone.hit.red{border-color:#FF6B6B;box-shadow:0 0 24px rgba(255,107,107,.45),inset 0 0 18px rgba(255,107,107,.15)} .zone.hit.black{border-color:#d6dcec;box-shadow:0 0 24px rgba(214,220,236,.35),inset 0 0 18px rgba(214,220,236,.1)}
.zone.miss{opacity:.8} .zone.champ.red{box-shadow:0 0 34px rgba(255,107,107,.6)} .zone.champ.black{box-shadow:0 0 34px rgba(214,220,236,.5)}
.d-center{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:10px;min-height:calc(var(--cw)*1.4);padding:4px 0}
.deck,.discard{position:relative;width:calc(var(--cw)*.42);aspect-ratio:5/7}
.deck i,.discard i{position:absolute;inset:0;border-radius:6%;background:repeating-linear-gradient(45deg,#15265a 0 4px,#1c3270 4px 8px);border:2px solid var(--gold);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.deck i:nth-child(1){transform:translate(-3px,3px)} .deck i:nth-child(2){transform:translate(-1.5px,1.5px)}
.discard{border:1px dashed rgba(212,175,106,.4);border-radius:6%} .discard i{transition:opacity calc(.3s*var(--spd))} .discard i:nth-child(1){transform:rotate(-6deg)} .discard i:nth-child(2){transform:rotate(5deg)} .discard i:nth-child(3){transform:rotate(1deg)}
.discard.k0 i{opacity:0} .discard.k1 i:nth-child(n+2){opacity:0} .discard.k2 i:nth-child(n+3){opacity:0}
.status{text-align:center;font-size:11.5px}
.state{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;border:1px solid rgba(212,175,106,.4);background:rgba(0,0,0,.28);color:#f0d594;font-weight:600;text-align:center}
.state i{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none} .state.rev{color:var(--ok);border-color:rgba(61,220,151,.5)} .state.rev i{background:var(--ok)}
.state.busy i{animation:dpulse 1s ease-in-out infinite} @keyframes dpulse{50%{opacity:.25;transform:scale(.7)}}
/* the arena card (a played, face-down card that flips at the reveal) */
.slot{width:var(--cw);aspect-ratio:5/7;perspective:900px;font-size:calc(var(--cw)/10);position:relative}
.slot::before{content:'';position:absolute;inset:0;border-radius:6%;border:1.5px dashed rgba(255,255,255,.18);background:rgba(0,0,0,.14)}
.pc{position:absolute;inset:0;transform-style:preserve-3d;transition:transform calc(.62s*var(--spd)) cubic-bezier(.2,1.22,.4,1),opacity calc(.3s*var(--spd)) ease;will-change:transform}
.pc.noanim,.pc.noanim *{transition:none!important}
.pc[data-s=deck]{transform:translate(var(--dx,0),var(--dy,0)) rotate(var(--rot,0deg)) scale(.46);opacity:0}
.pc[data-s=placed]{transform:none;opacity:1}

.pc.land{animation:dland calc(.45s*var(--spd)) ease-out} @keyframes dland{0%{filter:drop-shadow(0 0 0 rgba(69,230,224,0))}40%{filter:drop-shadow(0 0 14px rgba(69,230,224,.8))}100%{filter:none}}
.pc-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform calc(.7s*var(--spd)) cubic-bezier(.45,.05,.2,1)}
.flip .pc-in{transform:rotateY(180deg)}
.pc-b,.pc-f{position:absolute;inset:0;border-radius:6%;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 .6em 1.4em rgba(0,0,0,.55),0 .15em .35em rgba(0,0,0,.4)}
.pc-f{transform:rotateY(180deg);background:linear-gradient(160deg,#ffffff,#f3efe6);border:1px solid #cfc7b4}
.pc-b{background:#0f1b45;border:.22em solid #f1f3f9} .pb,.pb svg{width:100%;height:100%;display:block}
.pc-f::after,.hc .face::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.55),transparent 55%),repeating-linear-gradient(115deg,rgba(120,100,60,.035) 0 1px,transparent 1px 3px)}
.flier{position:fixed;z-index:70;pointer-events:none;perspective:900px;transform-origin:0 0}
.flier .pc-in{transition:none;transform:rotateY(180deg)}
/* the hand: four selectable face-up cards */
.hand-wrap{display:grid;gap:6px;justify-items:center;padding:10px 8px 12px;border-radius:16px;border:1px solid rgba(212,175,106,.28);background:linear-gradient(180deg,rgba(15,63,61,.35),rgba(10,42,58,.2))}
.hh{text-align:center;display:grid;gap:2px} .hh b{font-family:var(--f-d);font-size:15px} .hh b.rc,.hh b.bc{font-size:15px}
.hand{display:flex;gap:clamp(6px,1.8vw,20px);justify-content:center;padding:20px 0 24px;perspective:1000px}
.hc{position:relative;width:var(--hw);aspect-ratio:5/7;font-size:calc(var(--hw)/10);padding:0;border:0;background:none;cursor:pointer;border-radius:6%;transform:translateY(0) rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg));transition:transform .22s cubic-bezier(.2,.9,.3,1.25),opacity .3s,filter .3s;transform-style:preserve-3d;color:inherit}
.hc .face{position:absolute;inset:0;border-radius:6%;overflow:hidden;background:linear-gradient(160deg,#fff,#f3efe6);border:1px solid #cfc7b4;box-shadow:0 .5em 1.2em rgba(0,0,0,.5),0 .12em .3em rgba(0,0,0,.35);transition:box-shadow .22s}
.hc:hover,.hc:focus-visible{transform:translateY(-12px) rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg));outline:none} .hc:hover .face,.hc:focus-visible .face{box-shadow:0 1.1em 1.8em rgba(0,0,0,.55),0 0 0 2px rgba(69,230,224,.7),0 0 1.4em rgba(69,230,224,.35)}
.hc.sel{transform:translateY(-24px)} .hc.sel .face{box-shadow:0 1.3em 2em rgba(0,0,0,.55),0 0 0 3px var(--cy),0 0 2em rgba(69,230,224,.6)}
.hc .hint{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%) translateY(4px);opacity:0;white-space:nowrap;font:600 11px var(--f-d);color:var(--cy);transition:opacity .18s,transform .18s;pointer-events:none}
.hc:hover .hint,.hc:focus-visible .hint,.hc.sel .hint{opacity:1;transform:translateX(-50%)}
.hc .ck{position:absolute;top:-10px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--cy);color:#06222a;display:grid;place-items:center;transform:scale(0);transition:transform .2s cubic-bezier(.2,1.5,.4,1);z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.45)} .hc .ck svg{width:14px;height:14px} .hc.sel .ck{transform:scale(1)}
.hand[data-ph=dealing] .hc,.hand[data-ph=locking] .hc{pointer-events:none}
.hc.gone{opacity:.2;transform:translateY(10px) scale(.94);pointer-events:none;filter:saturate(.4)}
@media (hover:none){.hc .hint{display:none}}
.lockrow{display:flex;flex-direction:column;align-items:center;gap:6px}
.lockbtn{min-width:min(280px,86vw);letter-spacing:.06em}

.cover h3{font-size:20px} .cover p{max-width:52ch}
.wait{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--s1)}
.dots{display:inline-flex;gap:4px} .dots i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:ddots 1.1s ease-in-out infinite} .dots i:nth-child(2){animation-delay:.15s} .dots i:nth-child(3){animation-delay:.3s} @keyframes ddots{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.pfly{position:fixed;z-index:70;pointer-events:none;font:700 24px var(--f-m);color:var(--am);text-shadow:0 2px 12px rgba(0,0,0,.6)}

/* ---------- shared payoff matrix component ---------- */
const tg = r => /^Player /.test(r) ? 'P' + r.slice(7) : r[0];
// opts: roles ['You','Opponent'] | flags:boolean | last:[i,j] | sel:[i,j] | click:actionName | edit:true | an:analysis(optional)
function matrix(M, o = {}) {
  const roles = o.roles || ['You', 'Opponent'];
  const an = o.flags || o.edit ? (o.an || GT.analyze(M)) : null;
  const m = M.rows.length, n = M.cols.length;
  let h = `<div class="mx-wrap"><div class="mx" style="grid-template-columns:minmax(64px,.7fr) repeat(${n},minmax(70px,1fr))" role="grid" aria-label="Payoff matrix. Each cell shows ${esc(roles[0])} payoff, then ${esc(roles[1])} payoff.">`;
  h += `<div class="corner"><span class="cy">${esc(roles[0])} ↓ rows</span><span class="vi">${esc(roles[1])} → cols</span><span>cell = (${esc(tg(roles[0]))}, ${esc(tg(roles[1]))})</span></div>`;
  M.cols.forEach((c, j) => h += `<div class="ch ${o.selCol === j ? 'pick' : ''}" role="columnheader">${esc(c)}</div>`);
  for (let i = 0; i < m; i++) {
    h += `<div class="rh ${o.selRow === i ? 'pick' : ''}" role="rowheader">${esc(M.rows[i])}</div>`;
    for (let j = 0; j < n; j++) {
      const c = an ? an.cells[i][j] : null;
      const cls = ['cell'];
      if (o.click) cls.push('click');
      if (o.flags && c) { if (c.br1) cls.push('br1'); if (c.br2) cls.push('br2'); if (c.ne) cls.push('ne'); }
      if (o.cellClass) { const k = o.cellClass(i, j); if (k) cls.push(k); }
      if (o.last && o.last[0] === i && o.last[1] === j) cls.push('last');
      if (o.sel && o.sel[0] === i && o.sel[1] === j) cls.push('sel');
      if (o.dimNonLast && o.last && !(o.last[0] === i && o.last[1] === j)) cls.push('dim');
      const marked = o.marks && o.marks.has(i + ',' + j); if (marked) cls.push('sel');
      const flags = o.flags && c ? `<div class="flags">${c.br1 ? `<b class="f1" title="${esc(roles[0])}'s best response to this column">BR·${esc(tg(roles[0]))}</b>` : ''}${c.br2 ? `<b class="f2" title="${esc(roles[1])}'s best response to this row">BR·${esc(tg(roles[1]))}</b>` : ''}${c.ne ? '<b class="fn" title="Nash equilibrium">NASH</b>' : ''}${c.pareto && o.pareto ? '<b class="fp" title="Pareto efficient">PE</b>' : ''}</div>` : '';
      const lbl = `${M.rows[i]} and ${M.cols[j]}: ${roles[0]} ${M.pay[i][j][0]}, ${roles[1]} ${M.pay[i][j][1]}${c && c.ne ? ', Nash equilibrium' : ''}`;
      const tag = o.click ? `<div class="${cls.join(' ')}" role="gridcell" tabindex="0" data-a="${o.click}" data-r="${i}" data-col="${j}" aria-label="${esc(lbl)}">` : `<div class="${cls.join(' ')}" role="gridcell" aria-label="${esc(lbl)}">`;
      if (o.edit) {

      } else {
        h += `${tag}<div class="pay"><span class="a">${fmt(M.pay[i][j][0])}</span><i>,</i><span class="b">${fmt(M.pay[i][j][1])}</span></div>${flags}${marked ? '<div class="flags"><b class="fm">✓ my pick</b></div>' : ''}</div>`;
      }

}
const matrixLegend = (roles = ['You', 'Opponent']) => `<div class="legend" aria-label="Legend"><span><b class="cy mono">${esc(tg(roles[0]))}</b> = ${esc(roles[0])} payoff</span><span><b class="vi mono">${esc(tg(roles[1]))}</b> = ${esc(roles[1])} payoff</span><span><b class="cy mono">BR·${esc(tg(roles[0]))}</b> best response</span><span><b class="am mono">NASH</b> equilibrium</span><span><b class="ok mono">PE</b> Pareto efficient</span></div>`;

function explainCellHTML(M, i, j, roles = ['You', 'Opponent']) {
  const e = GT.explainCell(M, i, j);
  const row = (who, opts, ok, best, cls, axis) => {
    const here = opts.find(o => o.idx === (axis === 0 ? i : j));
    const alts = opts.filter(o => o.idx !== here.idx);
    const parts = alts.map(a => `${esc(a.name)} → <b class="mono">${fmt(a.payoff)}</b>${GT.eq(a.payoff, here.payoff) ? ' (a tie, not an improvement)' : a.payoff > here.payoff ? ' (better)' : ' (worse)'}`).join('; ');
    return `<li><b class="${cls}">${esc(who)}</b> keeps ${esc(here.name)} = <b class="mono">${fmt(here.payoff)}</b>. Switching alone: ${parts}. ${ok ? '<span class="ok">No profitable switch ✓</span>' : '<span class="red">Has a profitable switch ✗</span>'}</li>`;
  };
  const r1 = row(roles[0], e.p1, e.ok1, e.best1, 'cy', 0), r2 = row(roles[1], e.p2, e.ok2, e.best2, 'vi', 1);
  const pe = GT.analyze(M).cells[i][j];
  return `<div class="callout ${e.isNE ? 'am' : ''}" aria-live="polite"><b>Test (${esc(M.rows[i])}, ${esc(M.cols[j])})</b>: payoffs ${esc(roles[0])} <b class="mono cy">${fmt(e.cur[0])}</b>, ${esc(roles[1])} <b class="mono vi">${fmt(e.cur[1])}</b>
  <ul style="margin:6px 0 6px 16px;padding:0">${r1}${r2}</ul>
  <b>${e.isNE ? '<span class="am">Nash equilibrium.</span> Neither player gains by changing only their own strategy.' : 'Not a Nash equilibrium: at least one player would switch.'}</b>
  <div class="xs mono adv-only" style="margin-top:4px">Formally: (a*, b*) is a Nash equilibrium iff u₁(a*, b*) ≥ u₁(a, b*) for every row a, and u₂(a*, b*) ≥ u₂(a*, b) for every column b. Comparisons use a 1e-9 tolerance, so ties count as best responses.</div>
  <div class="xs muted" style="margin-top:4px">${pe.pareto ? 'This outcome is Pareto efficient: nobody can be made better off without hurting the other.' : 'This outcome is Pareto dominated: another cell gives both players at least as much, and one strictly more.'}</div></div>`;
}

const SGD = { pd: { opp: 'tft', len: 10 }, chicken: { opp: 'cautious', len: 8 }, stag: { opp: 'coop', len: 8 }, bos: { opp: 'alt', len: 8 }, mp: { opp: 'fair', len: 20 } };
const SG = {}; let curGame = 'pd';
function newMatch(id, keep) {
  const d = SGD[id] || {}; keep = keep || {};
  return { opp: keep.opp || d.opp, len: keep.len || d.len, round: 0, hist: [], done: false, stage: 'idle', pending: null, last: null, cu: 0, cv: 0, theory: !!keep.theory, sel: null, tab: keep.tab || 'play', rnd: GT.rng((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0), mode: keep.mode || 'pick', prob: keep.prob !== undefined ? keep.prob : 0.5, belief: 0.5, bp: 0.6, bq: 0.4, sim: null, pastSeq: P.past[id] || null, awarded: false };
}
const sg = id => SG[id] || (SG[id] = newMatch(id));
const PAST = { id: 'past', name: 'Your Past Self', desc: 'Replays, round by round, the choices you made in your most recent finished match of this game. It does not react to you.', act: c => { const p = c.past; if (!p || !p.length) return c.rnd() < .5 ? 0 : 1; return p[(c.round - 1) % p.length]; } };
const oppList = id => GT.OPP[id].concat([PAST]);
const policy = (id, oid) => oid === 'past' ? PAST : GT.OPP[id].find(o => o.id === oid) || GT.OPP[id][0];
const count = (g, i, j) => g.hist.filter(h => h.me === i && h.opp === j).length;
function openGame(id) { curGame = id; SG[id] = SG[id] || newMatch(id); if (S.page === 'play') { render(false); window.scrollTo(0, 0); } else go('play'); }

/* ---------- round loop (simultaneous games) ---------- */
function playRound(id, my) {
  const g = sg(id); if (g.stage === 'lock' || g.done) return;
  const pol = policy(id, g.opp);
  const ctx = { hist: g.hist.map(h => ({ me: h.opp, opp: h.me })), round: g.round + 1, rnd: g.rnd, past: g.pastSeq };
  const ai = pol.act(ctx);
  g.pending = { my, ai }; g.stage = 'lock'; render();
  setTimeout(() => finishRound(id), motionOn() ? (id === 'chicken' ? 900 : 550) : 0);
}
function finishRound(id) {
  const g = sg(id), G = GT.GAMES[id], { my, ai } = g.pending;
  const [u, v] = G.M.pay[my][ai];
  g.hist.push({ me: my, opp: ai, u, v }); g.cu += u; g.cv += v; g.round++; g.last = [my, ai]; g.stage = 'show'; g.pending = null;
  logRound({ game: id, opp: g.opp, round: g.round, you: G.M.rows[my], them: G.M.cols[ai], u, v });
  P.decisions++; SES.decisions++;
  const an = GT.analyze(G.M); const key = id + ':' + my + ',' + ai;
  const isNE = an.cells[my][ai].ne;
  if (isNE && !P.neSeen.includes(key)) { P.neSeen.push(key); SES.ne++; toast('Equilibrium discovered: ' + G.M.rows[my] + ' / ' + G.M.cols[ai]); addXP(10, 'equilibrium reached'); }
  if (g.round >= g.len) completeMatch(id);
  save(); paintProfile(); render();
}
function completeMatch(id) {
  const g = sg(id); g.done = true; g.stage = 'done';
  P.past[id] = g.hist.map(h => h.me); P.games++; SES.games++; P.matches[id] = (P.matches[id] || 0) + 1;
  if (id === 'pd' && count(g, 0, 0) / g.len >= .7) { P.coopMatches++; }
  addXP(30, 'match complete'); checkBadges();
}
ACT.pickgame = el => { curGame = el.dataset.g; SG[curGame] = SG[curGame] || newMatch(curGame); render(); };
ACT.gtab = el => { sg(curGame).tab = el.dataset.t; render(); };
ACT.choose = el => playRound(curGame, +el.dataset.ch);
ACT.setopp = el => { const g = sg(curGame); if (g.round > 0 && !g.done) return; if (g.done) { SG[curGame] = newMatch(curGame, { opp: el.dataset.o, len: g.len, theory: g.theory, tab: g.tab }); } else g.opp = el.dataset.o; render(); };
ACT.setlen = el => { const g = sg(curGame); if (g.round > 0) return; g.len = +el.dataset.n; render(); };
ACT.again = () => { const g = sg(curGame); SG[curGame] = newMatch(curGame, { opp: g.opp, len: g.len, theory: g.theory, tab: 'play', mode: g.mode, prob: g.prob }); render(); };
ACT.changeopp = () => { const g = sg(curGame); SG[curGame] = newMatch(curGame, { len: g.len, theory: g.theory }); render(); setTimeout(() => { const e = $('#opp-panel'); if (e) { e.scrollIntoView({ behavior: motionOn() ? 'smooth' : 'auto', block: 'center' }); const b = e.querySelector('button'); if (b) b.focus(); } }, 30); };
ACT.theory = () => { const g = sg(curGame); g.theory = !g.theory; render(); };
ACT.gcell = el => { const g = sg(curGame); g.sel = [+el.dataset.r, +el.dataset.col]; render(); };

/* ---------- shared text helpers ---------- */
function riskDom(M) { const a = (i, j, k) => M.pay[i][j][k]; const l1 = (a(0, 0, 0) - a(1, 0, 0)) * (a(0, 0, 1) - a(0, 1, 1)); const l2 = (a(1, 1, 0) - a(0, 1, 0)) * (a(1, 1, 1) - a(1, 0, 1)); return { l1, l2, rd: l1 > l2 + 1e-9 ? 0 : l2 > l1 + 1e-9 ? 1 : -1 }; }
function theoryHTML(M, roles) {
  const an = GT.analyze(M), dom = GT.dominance(M), mx = GT.mixed2x2(M);
  const nl = an.ne.length ? an.ne.map(([i, j]) => `<b class="am">(${esc(M.rows[i])}, ${esc(M.cols[j])})</b> → ${fmt(M.pay[i][j][0])}, ${fmt(M.pay[i][j][1])}`).join('<br>') : 'None in pure strategies.';
  const dl = (arr, names, who) => arr.length ? arr.map(d => `${who}: <b>${esc(names[d.s])}</b> is ${d.strict ? 'strictly' : 'weakly'} dominant`).join('; ') : `${who}: no dominant strategy`;
  let h = `<div class="col" style="gap:8px"><div><div class="lbl">Pure-strategy Nash equilibria (computed from the payoffs)</div><div class="mono sm" style="margin-top:3px">${nl}</div></div>
  <div><div class="lbl">Dominance</div><div class="sm">${dl(dom.dominant1, M.rows, roles[0])}<br>${dl(dom.dominant2, M.cols, roles[1])}</div></div>`;
  const pe = []; an.cells.forEach((r, i) => r.forEach((c, j) => { if (c.pareto) pe.push(`(${M.rows[i]}, ${M.cols[j]})`); }));
  h += `<div><div class="lbl">Pareto-efficient outcomes</div><div class="sm">${pe.map(esc).join(', ')}</div></div>`;
  if (mx) h += `<div><div class="lbl">Mixed-strategy equilibrium (2×2)</div><div class="sm">${mx.valid ? `${esc(roles[0])} plays ${esc(M.rows[0])} with probability <b class="mono">${fmt(mx.p, 3)}</b>; ${esc(roles[1])} plays ${esc(M.cols[0])} with probability <b class="mono">${fmt(mx.q, 3)}</b>.` : 'No fully mixed equilibrium exists (a pure strategy is always at least as good for someone).'}</div></div>`;
  if (mx && mx.valid) h += `<div class="adv-only"><div class="lbl">How the mix is found</div><div class="sm mono">q = (a₁₁ − a₀₁) / (a₀₀ − a₀₁ − a₁₀ + a₁₁) makes ${esc(roles[0])} indifferent; p = (b₁₁ − b₁₀) / (b₀₀ − b₀₁ − b₁₀ + b₁₁) makes ${esc(roles[1])} indifferent.</div></div>`;
  h += `<div><div class="lbl">Class</div><div class="sm">${esc(GT.classify2x2(M))}${GT.isZeroSum(M) ? ' · zero-sum' : ''}</div></div></div>`;
  return h;
}
function theoryVsMatch(id, g) {
  const M = GT.GAMES[id].M, an = GT.analyze(M), n = g.hist.length;
  const nes = an.ne.map(([i, j]) => `(${M.rows[i]}, ${M.cols[j]})`).join(' and ') || 'none in pure strategies';
  let body;
  if (n < 3) body = '<p class="sm muted">Play at least three rounds of this match to compare it with the theory.</p>';
  else {
    const hit = g.hist.filter(h => an.cells[h.me][h.opp].ne).length, pol = policy(id, g.opp);
    const cells = M.rows.flatMap((r, i) => M.cols.map((c, j) => ({ nm: `${r} / ${c}`, k: g.hist.filter(h => h.me === i && h.opp === j).length, ne: an.cells[i][j].ne })));
    body = `<div class="grid g2"><div><div class="lbl">${kindChip('theory')} Predicted</div><p class="sm" style="margin-top:4px">Pure Nash equilibria: <b>${esc(nes)}</b>.</p></div>
    <div><div class="lbl">${kindChip('sim')} This match (${n} rounds)</div><p class="sm" style="margin-top:4px"><b>${hit}</b> of ${n} rounds (${pct(hit / n)}) ended in an equilibrium cell.</p></div></div>
    ${bars(cells.map(c => ({ label: c.nm, value: c.k / n, text: c.k + (c.ne ? ' · NASH' : ''), color: c.ne ? 'var(--am)' : 'var(--vi)' })))}
    <div class="callout am" style="margin-top:8px">${kindChip('assume')} Theory assumes both sides best-respond to each other. Your opponent here is <b>${esc(pol.name)}</b>, which follows its own written rule, and you chose your moves yourself. Differences from the prediction are expected and are not errors.</div>`;
  }
  return `<div class="card" style="margin-top:12px"><div class="sec-h"><h3>Theory versus this match</h3></div>${body}</div>`;
}
function counterfactual(id, g) {
  const M = GT.GAMES[id].M; if (!g.hist.length) return '';
  const rows = M.rows.map((nm, s) => ({ nm, t: sum(g.hist.map(h => M.pay[s][h.opp][0])) }));
  return `<div class="lbl" style="margin-top:10px">Replay: what each fixed strategy would have scored against the moves this opponent actually made</div>
  <table class="t"><thead><tr><th>Your strategy</th><th class="n">Total</th></tr></thead><tbody>${rows.map(r => `<tr><td>Always ${esc(r.nm)}</td><td class="n">${fmt(r.t)}</td></tr>`).join('')}<tr><td><b>Your actual play</b></td><td class="n"><b>${fmt(g.cu)}</b></td></tr></tbody></table>
  <div class="xs dim" style="margin-top:4px">Caution: opponents that react to you (like Tit-for-Tat) might have played differently if you had played differently. This replay assumes they would not.</div>`;

/* ---------- per-game explanations (generated from the actual round data) ---------- */
function explainOutcome(id, g) {
  const G = GT.GAMES[id], M = G.M, n = g.hist.length, pol = policy(id, g.opp);
  const avg = g.cu / n, avgO = g.cv / n; let h = '';
  const head = `<p>You scored <b class="mono cy">${fmt(g.cu)}</b> (${fmt(avg)} per round) and <b>${esc(pol.name)}</b> scored <b class="mono vi">${fmt(g.cv)}</b> (${fmt(avgO)} per round).</p>`;
  if (id === 'pd') {
    const cc = count(g, 0, 0), dd = count(g, 1, 1), cd = count(g, 0, 1), dc = count(g, 1, 0);
    const per = { allc: 'Always Cooperate never reacts, so defecting against it earned the maximum 5 per round. It shows the temptation, but this opponent is not reasoning strategically.', alld: 'Against Always Defect, Defect is your best response every round (1 beats 0). Cooperating only handed them 5.', tft: 'Tit-for-Tat repeats your last move. A defection gains 5 once, then invites retaliation, so steady cooperation tends to beat serial defection against it.', rand: 'A random opponent cannot be influenced by your history. Against a 50/50 mix, Defect has expected payoff 3.0 and Cooperate 1.5, so defection is the higher-expected-payoff choice.', pavlov: 'Win-Stay, Lose-Shift keeps a move that scored 3 or 5 and switches after 0 or 1. It can be exploited for a round and then sometimes recovers cooperation.', past: 'Your past self ignores what you do now. It reflects your earlier habits, so beating it means improving on your own earlier pattern.' };
    h = head + `<div class="grid g4" style="margin:8px 0">${[['Both cooperated', cc], ['Both defected', dd], ['You exploited', dc], ['You were exploited', cd]].map(x => `<div class="stat"><span class="lbl">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
    <p><b>Why this happens.</b> In a single round, Defect pays more than Cooperate whatever the other player does (5 > 3 and 1 > 0). Defect is a strictly dominant strategy, so (Defect, Defect) is the only Nash equilibrium. Yet it gives 1 each, while mutual cooperation gives 3 each. That gap is the tension between individual rationality and collective welfare.</p>
    <p style="margin-top:6px">${per[g.opp]}</p><p style="margin-top:6px" class="muted">For reference: ${fmt(1)} per round is the one-shot equilibrium outcome and ${fmt(3)} per round is full cooperation. With a known final round, backward induction predicts defection in every round, but that argument needs common knowledge of rationality. Results in repeated play depend on the opponent’s rule, the horizon, and the incentives.</p>`;
  } else if (id === 'chicken') {
    const mx = GT.mixed2x2(M), ex = GT.expected(M, mx.p, mx.q);
    const crash = count(g, 1, 1);
    h = head + `<div class="grid g4" style="margin:8px 0">${[['Both swerved', count(g, 0, 0)], ['You held, they swerved', count(g, 1, 0)], ['You swerved, they held', count(g, 0, 1)], ['Crashes', crash]].map(x => `<div class="stat"><span class="lbl">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
    <p><b>Why this happens.</b> There are two pure-strategy equilibria: (Stay Straight, Swerve) and (Swerve, Stay Straight). If the other driver will stay, swerving (1) beats crashing (−5). If the other will swerve, staying (4) beats swerving (2). Each player wants to be the one who holds the line, but if both do, both lose the most.</p>
    <p style="margin-top:6px"><b>How it differs from the Prisoner’s Dilemma.</b> Nobody has a dominant strategy here. The best action depends on what you expect, so signals, reputation and commitment matter. The mixed equilibrium has each driver staying straight with probability ${fmt(1 - mx.p, 2)}, giving expected payoff ${fmt(ex.u1, 2)} each, which is worse than the pure equilibria for the player who holds and better than a crash.</p>`;
  } else if (id === 'stag') {
    const rd = riskDom(M), mx = GT.mixed2x2(M);
    h = head + `<div class="grid g4" style="margin:8px 0">${[['Both hunted stag', count(g, 0, 0)], ['Both hunted hare', count(g, 1, 1)], ['You stag, they hare', count(g, 0, 1)], ['You hare, they stag', count(g, 1, 0)]].map(x => `<div class="stat"><span class="lbl">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
    <p><b>Why this happens.</b> There are two pure equilibria: (Stag, Stag) and (Hare, Hare). Each is a best response to itself. (Stag, Stag) is <b>payoff dominant</b> (4,4 beats 3,3). (Hare, Hare) is <b>risk dominant</b>: its product of deviation losses is ${rd.l2} against ${rd.l1} for (Stag, Stag). Hunting stag is worth it only if you believe your partner hunts stag with probability above ${fmt(mx.q, 2)}.</p>
    <p style="margin-top:6px" class="muted">The game shows why coordination can fail without any player being irrational: the better outcome needs mutual trust.</p>`;
  } else if (id === 'bos') {
    const meet = count(g, 0, 0) + count(g, 1, 1), mx = GT.mixed2x2(M), ex = GT.expected(M, mx.p, mx.q);
    h = head + `<div class="grid g3" style="margin:8px 0">${[['Met at Opera', count(g, 0, 0)], ['Met at Football', count(g, 1, 1)], ['Missed each other', n - meet]].map(x => `<div class="stat"><span class="lbl">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
    <p><b>Why this happens.</b> Both (Opera, Opera) and (Football, Football) are Nash equilibria: once you are together, neither wants to leave alone. The players agree that meeting is better than not meeting, but disagree about where. That is coordination mixed with conflict.</p>
    <p style="margin-top:6px">There is also a mixed equilibrium (you pick Opera with probability ${fmt(mx.p, 2)}, they pick Opera with probability ${fmt(mx.q, 2)}). It leaves each player ${fmt(ex.u1, 2)} on average and makes them miss each other ${pct(1 - (mx.p * mx.q + (1 - mx.p) * (1 - mx.q)))} of the time, so both prefer a pure equilibrium.</p>`;
  } else if (id === 'mp') {
    const w = g.hist.filter(x => x.u > 0).length, l = n - w, hh = g.hist.filter(x => x.me === 0).length;
    h = head + `<div class="grid g3" style="margin:8px 0">${[['Wins', w], ['Losses', l], ['Your Heads rate', pct(hh / n)]].map(x => `<div class="stat"><span class="lbl">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
    <p><b>Why this happens.</b> The game is zero-sum and has no pure-strategy Nash equilibrium: whichever pure choice you make, the opponent’s best response beats it, and then you would switch. The only equilibrium is mixed: each player picks Heads with probability 0.5, which gives an expected payoff of 0 to both.</p>
    <p style="margin-top:6px">${g.opp === 'fair' ? 'Against a fair coin, no plan beats an expected 0. Your total is the luck of ' + n + ' coin flips (typical swing about ±' + fmt(Math.sqrt(n), 1) + ' points).' : g.opp === 'biasH' ? 'This opponent plays Heads 70% of the time. Always playing Heads has expected payoff +0.4 per round against it. Equilibrium play only guarantees 0 against a perfect opponent. It does not punish an exploitable one.' : g.opp === 'exploit' ? 'The pattern hunter counts your moves and plays against your most frequent one. Only unpredictable play protects you from it.' : 'Your past self does not react, so any bias in your old play could be exploited.'}</p>`;
  } else if (id === 'ult') { return ''; }

}

/* ---------- game-specific side panels ---------- */

  }

    return `<div class="card"><div class="sec-h"><h3>Risk indicator</h3><span class="chip red">crash = −5 each</span></div>
    <div class="meter" style="margin:10px 4px 14px" role="img" aria-label="Observed crash rate ${pct(n ? count(g, 1, 1) / n : 0)}"><i style="left:calc(${clamp(n ? count(g, 1, 1) / n : 0, 0, 1) * 100}% - 2px)"></i></div>
    <div class="row xs muted" style="justify-content:space-between"><span>0% crashes</span><span>100% crashes</span></div>
    <div class="grid g2" style="margin-top:8px"><div class="stat"><span class="lbl">Observed crash rate</span><b>${n ? pct(count(g, 1, 1) / n) : '—'}</b></div><div class="stat"><span class="lbl">You stayed straight</span><b>${n ? pct(mine) : '—'}</b></div></div>
    <div class="xs dim" style="margin-top:6px">Rates come from the rounds played so far. They are not forecasts.</div></div>`;
  }
  if (id === 'stag') {
    const stags = g.hist.filter(h => h.opp === 0).length, est = (stags + 1) / (n + 2), mx = GT.mixed2x2(M);
    const evS = GT.expected(M, 1, est).u1rows;
    return `<div class="card"><div class="sec-h"><h3>Partner confidence</h3><span class="chip am">teaching aid</span></div>
    <div class="mono" style="font-size:26px;color:var(--am)">${pct(est)}</div>
    <div class="bar" style="margin:6px 0"><i style="width:${est * 100}%;background:var(--am)"></i></div>
    <div class="xs muted">Estimated from ${n} observed round${n === 1 ? '' : 's'}: (stag rounds + 1) ÷ (rounds + 2), starting at 50% before any evidence. It is a simple estimate, not a measured probability of the next move.</div>
    <div class="grid g2" style="margin-top:8px"><div class="stat"><span class="lbl">EV of Stag</span><b>${fmt(evS[0], 2)}</b></div><div class="stat"><span class="lbl">EV of Hare</span><b>${fmt(evS[1], 2)}</b></div></div>
    <div class="xs muted" style="margin-top:6px">Stag is worth more than Hare once your confidence exceeds <b class="mono">${pct(mx.q)}</b>.</div></div>`;
  }
  if (id === 'bos') {
    const meet = g.hist.filter(h => h.me === h.opp).length;

function tournamentHTML() {

    return sa / N;
  }));

  <p class="sm muted" style="margin-top:8px">Ranking by mean: ${rank.map((r, i) => `${i + 1}. ${esc(r.n.split(' (')[0])} (${fmt(r.avg, 2)})`).join(' · ')}. Note that Always Defect never loses a pairing head to head, yet nice but retaliatory strategies can score higher overall by cooperating with each other.</p>`;
}

function nashSteps() {

/* ---- tab 3: best responses ---- */
function brPath(M) {
  const mx = GT.mixed2x2(M), pts1 = [], pts2 = [];
  const build = (f, star, flip) => { // f(prob)->0|1|'any'; returns polyline in (p,q)
    const seg = (v, a, b) => flip ? [[a, v], [b, v]] : [[v, a], [v, b]];
    if (star !== null && star > 0 && star < 1) {
      const lo = f(star / 2), hi = f((1 + star) / 2), pts = [];
      const P = (u, w) => flip ? [w, u] : [u, w]; // u along "own" axis, w along other
      pts.push(P(0, lo), P(star, lo), P(star, 0), P(star, 1), P(star, hi), P(1, hi));
      return pts;
    }
    const v = f(.5); if (v === 'any') return null;
    return flip ? [[0, v], [1, v]] : [[v, 0], [v, 1]];
  };
  // BR1: p as function of q -> points (p,q) ; BR2: q as function of p -> points (p,q)
  const br1 = (() => { const star = mx && mx.q !== null ? mx.q : null; if (star !== null && star > 0 && star < 1) { const lo = GT.br1(M, star / 2), hi = GT.br1(M, (1 + star) / 2); return [[lo, 0], [lo, star], [0, star], [1, star], [hi, star], [hi, 1]]; } const v = GT.br1(M, .5); return v === 'any' ? null : [[v, 0], [v, 1]]; })();
  const br2 = (() => { const star = mx && mx.p !== null ? mx.p : null; if (star !== null && star > 0 && star < 1) { const lo = GT.br2(M, star / 2), hi = GT.br2(M, (1 + star) / 2); return [[0, lo], [star, lo], [star, 0], [star, 1], [star, hi], [1, hi]]; } const v = GT.br2(M, .5); return v === 'any' ? null : [[0, v], [1, v]]; })();
  return { br1, br2, mx };
}
