/* ---------- concept library ---------- */
const CONCEPTS = [
  { id: 'what', g: 'Foundations', title: 'What is Game Theory?', def: 'The study of choices when your result depends on what other people choose too.', formal: 'A game specifies players N, strategy sets Sᵢ, and payoff functions uᵢ(s₁,…,sₙ).', ex: 'Two coffee shops on one street choose prices. Each shop’s profit depends on the rival’s price as well as its own.', game: 'pd', demo: 'matrix', dg: 'pd', mis: 'It is not only about winning or about parlor games. It also covers cooperation, bargaining, auctions and evolution.', q: { t: 'Which situation is a strategic interaction?', o: ['Choosing an ice-cream flavor alone', 'Two shops choosing prices for the same customers', 'Rolling a fair die', 'Reading a book alone'], a: 1, why: 'Strategic interaction means each decision-maker’s outcome depends on the others’ choices. The shops’ profits are linked.' }, adv: 'Game theory is a set of models. Different models fit different questions, and each depends on assumptions about information, timing and what players value.' },
  { id: 'anatomy', g: 'Foundations', title: 'Players, Strategies, Payoffs, Outcomes', def: 'Players decide, strategies are their plans, payoffs say how good each result is, and an outcome is one strategy for every player.', formal: 'Outcome s = (s₁,…,sₙ) ∈ S₁×…×Sₙ. Player i receives uᵢ(s).', ex: 'In the Prisoner’s Dilemma the outcome (Defect, Cooperate) gives the first player 5 and the second 0.', game: 'pd', demo: 'anat', mis: 'Payoffs are not necessarily money or selfishness. They are whatever each player cares about, ranked by preference.', q: { t: 'In a payoff matrix, the pair (Defect, Cooperate) is called…', o: ['a strategy', 'a strategy profile, or outcome', 'a payoff', 'a player'], a: 1, why: 'One strategy for each player together form a strategy profile. It maps to a payoff for each player.' }, adv: 'Payoffs in this site are ordinal-and-numeric teaching values. In theory they represent utility, which can include fairness, risk attitude, or altruism.' },
  { id: 'simseq', g: 'Foundations', title: 'Simultaneous vs Sequential Games', def: 'In simultaneous games players choose without seeing each other’s move. In sequential games, later movers see what happened before.', formal: 'Simultaneous games are shown in normal form (matrix). Sequential games are shown in extensive form (tree).', ex: 'Sealed-bid auctions are simultaneous. A chess game is sequential.', game: 'chicken', demo: 'seqsim', mis: 'Simultaneous does not mean at the same instant. It means no player can observe the others’ choices before choosing.', q: { t: 'In the Ultimatum Game the responder decides after seeing the offer. The game is…', o: ['Simultaneous', 'Sequential', 'Zero-sum', 'Cooperative'], a: 1, why: 'The responder observes the proposer’s move first, so the game is sequential and naturally modelled as a tree.' }, adv: 'Information sets let a tree represent simultaneity: nodes the player cannot tell apart are grouped together.' },
  { id: 'zero', g: 'Foundations', title: 'Zero-Sum vs Non-Zero-Sum Games', def: 'In a zero-sum game one player’s gain is exactly the other’s loss. In non-zero-sum games, players can gain or lose together.', formal: 'Zero-sum: u₁(s) + u₂(s) = 0 for every outcome s.', ex: 'Matching Pennies is zero-sum. A trade that benefits both sides is not.', game: 'mp', demo: 'zero', mis: 'Many people treat every conflict as zero-sum. Most real situations have room for mutual gain or mutual loss.', q: { t: 'In the Prisoner’s Dilemma the payoff totals are 6, 5, 5 and 2. The game is…', o: ['Zero-sum', 'Non-zero-sum', 'Not a game', 'Sequential'], a: 1, why: 'The total varies with the outcome (and is never 0), so it is non-zero-sum. That is why cooperation can create value.' }, adv: 'A constant-sum game (total always the same constant) is strategically equivalent to a zero-sum game.' },
  { id: 'coop', g: 'Foundations', title: 'Cooperative vs Non-Cooperative Games', def: 'Non-cooperative game theory assumes agreements are not automatically enforceable. Cooperative theory assumes players can make binding agreements.', formal: 'Cooperative games are often described by a value function v(S) for coalitions S.', ex: 'A signed enforceable contract turns “promise to cooperate” into a move that is actually available.', game: 'pd', demo: 'coop', mis: '“Non-cooperative” does not mean hostile. Players can cooperate in equilibrium when it serves their interests.', q: { t: 'What does enforcing a penalty for defecting do in the Prisoner’s Dilemma?', o: ['Nothing', 'It changes payoffs so cooperation can become an equilibrium', 'It removes the opponent', 'It makes the game zero-sum'], a: 1, why: 'Enforcement changes the effective payoffs. With a big enough penalty, defecting no longer pays.' }, adv: 'Nash called the non-cooperative approach the more fundamental one: cooperation should be explained as an equilibrium of a game with explicit rules.' },
  { id: 'info', g: 'Foundations', title: 'Complete vs Incomplete Information', def: 'With complete information everyone knows the game: players, strategies and payoffs. With incomplete information someone is unsure about another player’s payoffs or type.', formal: 'Incomplete information is modelled with types θᵢ drawn from a distribution that players know (Harsanyi).', ex: 'A bidder does not know how much the others value the item.', game: 'chicken', demo: 'bayes', mis: 'It is often confused with imperfect information, which is about not observing earlier moves rather than not knowing payoffs.', q: { t: 'Incomplete information means…', o: ['A player cannot see earlier moves', 'Some player is unsure of another player’s payoffs or type', 'The game has too few players', 'Payoffs are random every round'], a: 1, why: 'Uncertainty about payoffs or types is incomplete information. Not seeing moves is imperfect information.' }, adv: 'Harsanyi’s trick: model nature as drawing each player’s type, which turns incomplete information into imperfect information.' },
  { id: 'dominant', g: 'Strategic concepts', title: 'Dominant and Dominated Strategies', def: 'A strategy is dominated if another strategy does at least as well against everything and strictly better against something. A dominant strategy beats all the others.', formal: 'sᵢ strictly dominates sᵢ′ if uᵢ(sᵢ, s₋ᵢ) > uᵢ(sᵢ′, s₋ᵢ) for all s₋ᵢ.', ex: 'In the Prisoner’s Dilemma, Defect strictly dominates Cooperate.', game: 'pd', demo: 'dom', mis: 'A dominant strategy does not guarantee a good collective result. In the Prisoner’s Dilemma both players’ dominant strategies lead to the worse outcome.', q: { t: 'A rational player will never play a strategy that is…', o: ['Strictly dominated', 'Risk dominant', 'Mixed', 'Part of a Pareto outcome'], a: 0, why: 'A strictly dominated strategy is worse than another against every opponent choice, so it is never a best response to any belief.' }, adv: 'Iterated elimination assumes common knowledge of rationality. Weak dominance can make the result depend on elimination order.' },
  { id: 'nash', g: 'Strategic concepts', title: 'Nash Equilibrium', def: 'A set of strategies, one per player, where no player can do better by changing only their own strategy.', formal: 'uᵢ(sᵢ*, s₋ᵢ*) ≥ uᵢ(sᵢ, s₋ᵢ*) for every player i and every sᵢ.', ex: 'Both drivers choosing opposite actions in Chicken: neither wants to switch alone.', game: 'stag', demo: 'matrix', dg: 'stag', mis: 'A Nash equilibrium is not necessarily the best outcome, the fair outcome, or the unique outcome.', q: { t: 'Which statement is correct?', o: ['Every Nash equilibrium is Pareto efficient', 'A Nash equilibrium can be Pareto dominated', 'Every game has exactly one Nash equilibrium', 'Nash equilibrium requires dominant strategies'], a: 1, why: 'In the Prisoner’s Dilemma, (Defect, Defect) is a Nash equilibrium but both players prefer (Cooperate, Cooperate).' }, adv: 'Nash (1950, 1951) proved that every finite game has at least one equilibrium if mixed strategies are allowed.' },
  { id: 'mixed', g: 'Strategic concepts', title: 'Pure and Mixed Strategies', def: 'A pure strategy is one definite choice. A mixed strategy randomizes with chosen probabilities.', formal: 'In a 2×2 game, the opponent’s mix q* makes you indifferent: u₁(row 1, q*) = u₁(row 2, q*).', ex: 'A penalty taker who sometimes shoots left and sometimes right.', game: 'mp', demo: 'mixed', mis: 'Mixing is not random for its own sake. Its purpose is to leave the opponent with no exploitable pattern.', q: { t: 'In standard Matching Pennies each player’s equilibrium probability of Heads is…', o: ['0', '1/4', '1/2', '1'], a: 2, why: 'At 1/2 the opponent is indifferent between Heads and Tails, so neither can gain by deviating.' }, adv: 'In a mixed equilibrium your probabilities are set to make the other player indifferent, not yourself.' },
  { id: 'br', g: 'Strategic concepts', title: 'Best Responses', def: 'A best response is the choice that gives you the highest payoff given what the others do.', formal: 'BRᵢ(s₋ᵢ) = argmax over sᵢ of uᵢ(sᵢ, s₋ᵢ).', ex: 'If the other driver will stay straight, your best response is to swerve.', game: 'chicken', demo: 'matrix', dg: 'chicken', mis: 'A best response depends on the opponent’s choice. It is not “the best move” in general.', q: { t: 'In Chicken, if the opponent stays straight, your best response is…', o: ['Stay straight (−5)', 'Swerve (1)', 'Either, they are equal', 'Neither'], a: 1, why: 'Swerving gives 1. Staying straight gives −5, the crash.' }, adv: 'A Nash equilibrium is exactly a profile where every player’s strategy is a best response to the others’.' },
  { id: 'pareto', g: 'Strategic concepts', title: 'Pareto Efficiency', def: 'An outcome is Pareto efficient if nobody can be made better off without making someone worse off.', formal: 'Outcome x is Pareto dominated by y if uᵢ(y) ≥ uᵢ(x) for all i and uⱼ(y) > uⱼ(x) for some j.', ex: 'In the Prisoner’s Dilemma, mutual cooperation (3,3) Pareto dominates mutual defection (1,1).', game: 'pd', demo: 'matrix', dg: 'pd', mis: 'Efficient does not mean fair or equilibrium. It only says no free improvement exists.', q: { t: 'In the Prisoner’s Dilemma, which outcome is Pareto dominated?', o: ['(Cooperate, Cooperate)', '(Defect, Cooperate)', '(Defect, Defect)', 'None'], a: 2, why: '(Defect, Defect) gives (1,1). (Cooperate, Cooperate) gives (3,3), better for both.' }, adv: 'Pareto efficiency ignores distribution: giving everything to one player can be efficient.' },
  { id: 'indiv', g: 'Strategic concepts', title: 'Individual Rationality', def: 'Each player chooses what is best for them given their beliefs and preferences.', formal: 'Player i maximizes expected uᵢ given beliefs about s₋ᵢ. In contracts, a participation (individual rationality) constraint requires uᵢ ≥ the outside option.', ex: 'Each prisoner defects because it is better for them whatever the other does.', game: 'pd', demo: 'matrix', dg: 'pd', mis: 'Rational does not mean selfish. Payoffs can include other people’s welfare.', q: { t: 'In a one-shot Prisoner’s Dilemma, individually rational play leads to…', o: ['Mutual cooperation', 'Mutual defection', 'Random play', 'A mixed equilibrium'], a: 1, why: 'Defect is strictly dominant for both, so individually rational players end up at (Defect, Defect).' }, adv: 'What looks irrational (cooperating in a one-shot dilemma) can be rational once payoffs include guilt, trust or reputation. That changes the game.' },
  { id: 'interdep', g: 'Strategic concepts', title: 'Strategic Interdependence', def: 'Your best move depends on what others do, and theirs on what you do.', formal: 'uᵢ depends on s₋ᵢ, so each BRᵢ is a function of the others’ strategies.', ex: 'Airlines deciding on prices or capacity.', game: 'chicken', demo: 'interdep', mis: 'You cannot find the best move by looking only at your own payoffs.', q: { t: 'In Chicken, what determines your best choice?', o: ['Only your own payoffs', 'What you expect the other driver to do', 'The number of rounds', 'Nothing, it is luck'], a: 1, why: 'Your best reply flips depending on whether the other will swerve or stay.' }, adv: 'This is why equilibrium is defined as a fixed point of the best-response correspondences.' },
  { id: 'credible', g: 'Strategic concepts', title: 'Credible Threats and Commitments', def: 'A threat is credible if carrying it out is in your interest when the time comes, or if you have committed so you cannot back down.', formal: 'A threat is credible if it is part of a subgame-perfect strategy.', ex: 'Burning your bridges: removing your own option to retreat.', game: 'chicken', demo: 'threat', mis: 'Saying you will do something costly is not a credible threat unless you would really do it.', q: { t: 'A threat is credible when…', o: ['It is said loudly', 'Carrying it out is in the threatener’s interest at that point, or they are committed', 'It is expensive for the opponent', 'It is mixed'], a: 1, why: 'Rational opponents ignore threats the threatener would not want to carry out.' }, adv: 'Commitment can help even though it reduces your options, which is a recurring theme in bargaining and deterrence.' },
  { id: 'backward', g: 'Advanced', title: 'Backward Induction', def: 'Solve a sequential game from the end: work out what the last mover would do, then what the player before them would do given that, and so on back to the start.', formal: 'Compute optimal choices at final decision nodes, replace each node by its resulting payoff, and repeat.', ex: 'In the market-entry game, the incumbent’s best reply to entry is to accommodate, so entry pays.', game: 'ult', demo: 'tree', tree: 'entry', mis: 'Players do not decide forward in the dark. They reason about their future selves and others.', q: { t: 'Backward induction starts at…', o: ['The first decision node', 'The last decision nodes', 'The payoffs sum', 'A random node'], a: 1, why: 'The last mover has no further consequences to anticipate, so their choice is easiest to determine.' }, adv: 'In long finite games like the centipede, backward induction can predict outcomes that people rarely play, which is an active research topic.' },
  { id: 'extensive', g: 'Advanced', title: 'Extensive-Form Games', def: 'A game written as a tree showing who moves when, what they can do, what they know, and the final payoffs.', formal: 'A tree with player-labelled decision nodes, actions as edges, information sets, and terminal payoffs.', ex: 'The mini-ultimatum tree: the proposer picks a split, then the responder accepts or rejects.', game: 'ult', demo: 'tree', tree: 'ult', mis: 'A tree is not only a picture. It records the order of moves and what players know.', q: { t: 'What does an extensive-form tree show that a payoff matrix does not directly show?', o: ['Payoffs', 'The order of moves and information', 'Who wins', 'The number of equilibria'], a: 1, why: 'The tree makes the timing and information structure explicit.' }, adv: 'Every extensive-form game has a normal-form representation but it can hide which threats are credible.' },
  { id: 'spne', g: 'Advanced', title: 'Subgame-Perfect Nash Equilibrium', def: 'A Nash equilibrium that is also a Nash equilibrium in every subgame, which rules out non-credible threats.', formal: 'A strategy profile is subgame perfect if its restriction to each subgame is a Nash equilibrium of that subgame (Selten).', ex: '(Out, Fight) is Nash in the entry game but not subgame perfect.', game: 'ult', demo: 'tree', tree: 'entry', mis: 'Not every Nash equilibrium of a sequential game is sensible. Some rely on threats nobody would carry out.', q: { t: 'In the entry game, (Stay out, Fight) is Nash but not subgame perfect because…', o: ['Fighting is too costly in the first move', 'The incumbent would not actually fight after entry', 'The entrant is irrational', 'There is no tree'], a: 1, why: 'After entry, accommodating (2) beats fighting (−1). The threat is not credible.' }, adv: 'Selten introduced subgame perfection (1965) and refined it in 1975 (see References). Backward induction finds it in finite games of perfect information.' },
  { id: 'repeated', g: 'Advanced', title: 'Repeated Games', def: 'The same game played many times. History can be used to reward cooperation and punish defection, which can sustain cooperation.', formal: 'Grim trigger sustains cooperation in the repeated PD if δ ≥ (T − R)/(T − P).', ex: 'Two neighboring shops that expect to meet again tomorrow behave differently from strangers.', game: 'pd', demo: 'repeated', mis: 'In theory a finitely repeated Prisoner’s Dilemma with a known end unravels to defection, yet real behavior and uncertain horizons differ.', q: { t: 'What mainly makes cooperation sustainable in an infinitely repeated Prisoner’s Dilemma?', o: ['Dominance of cooperate', 'Valuing future payoffs enough, with credible punishment', 'Random play', 'Pareto efficiency'], a: 1, why: 'If δ is high enough, the future loss from punishment outweighs the one-time gain from defecting.' }, adv: 'The Folk Theorems say many outcomes can be equilibria in repeated games with patient players.' },
  { id: 'bayes', g: 'Advanced', title: 'Bayesian Games and Beliefs', def: 'Games where players hold beliefs about each other’s hidden types and choose to maximize expected payoff.', formal: 'Bayesian Nash equilibrium: each type’s action maximizes expected payoff given beliefs and the others’ type-contingent strategies.', ex: 'Not knowing whether a rival driver is reckless or cautious.', game: 'chicken', demo: 'bayes', mis: 'Beliefs are not guesses to ignore. They are part of the model, and equilibrium requires them to be consistent.', q: { t: 'Using this site’s Chicken payoffs, if you believe the opponent is the aggressive type with probability 0.5, which action has the higher expected payoff?', o: ['Swerve (1.5)', 'Stay straight (−0.5)', 'They are equal', 'Cannot be computed'], a: 0, why: 'EV(Swerve) = 2 − π = 1.5. EV(Stay) = 4 − 9π = −0.5.' }, adv: 'Bayes’ rule updates beliefs after observing actions, which is the basis of perfect Bayesian equilibrium.' },
  { id: 'signal', g: 'Advanced', title: 'Signaling and Screening', def: 'Signaling: an informed party takes a costly action to reveal its type. Screening: the uninformed party offers choices that sort types.', formal: 'A separating equilibrium requires cᴴ ≤ w ≤ cᴸ, where w is the reward and cᴴ, cᴸ are the types’ costs of the signal.', ex: 'A degree can signal ability if it is easier to earn for high-ability people.', game: 'bos', demo: 'signal', mis: 'A signal does not have to build real skill. It just has to be costlier for the lower type to fake.', q: { t: 'A costly signal can separate types only if…', o: ['It is free', 'It costs the low type more than it is worth, while the high type still gains', 'Everyone sends it', 'It is random'], a: 1, why: 'The reward must be worth it for the high type but not for the low type.' }, adv: 'Spence’s job-market signaling model (1973) and Akerlof’s market for lemons (1970) are the classic references.' },
  { id: 'mech', g: 'Advanced', title: 'Mechanism Design', def: 'Designing the rules of a game so that self-interested players end up producing a desired outcome.', formal: 'A mechanism maps players’ reports to outcomes. It is incentive compatible if truthful reporting is optimal.', ex: 'A second-price auction makes bidding your true value a dominant strategy.', game: 'ult', demo: 'mech', mis: 'It is often called “reverse game theory”: instead of analyzing given rules, you choose rules.', q: { t: 'In a second-price sealed-bid auction, a bidder’s best bid is…', o: ['Half their value', 'Their true value', 'Zero', 'As high as possible'], a: 1, why: 'Bidding your value is weakly dominant: you win exactly when winning is worth it, and pay the rival’s bid, not your own.' }, adv: 'Vickrey (1961) analyzed second-price auctions. Hurwicz, Maskin and Myerson later developed mechanism design more generally.' },
];
const GROUPS = ['Foundations', 'Strategic concepts', 'Advanced'];
function openConcept(id) { LS.sel = id; LT.tab = 'concepts'; go('learn', { after: () => markExplored(id) }); }
function markExplored(id) { if (!P.concepts.includes(id)) { P.concepts.push(id); save(); paintProfile(); } }
ACT.concept = el => { LS.sel = el.dataset.id; markExplored(LS.sel); render(); const d = $('#concept'); if (d && window.innerWidth < 900) d.scrollIntoView({ behavior: motionOn() ? 'smooth' : 'auto' }); };
ACT.grp = el => { LS.grp = el.dataset.g; render(); };
INP.lsearch = el => { LS.q = el.value; const l = $('#clist'); if (l) l.innerHTML = conceptList(); };
function conceptList() {
  const q = LS.q.toLowerCase(), items = CONCEPTS.filter(c => (LS.grp === 'all' || c.g === LS.grp) && (!q || (c.title + c.def + c.g).toLowerCase().includes(q)));
  if (!items.length) return '<div class="card muted">No concept matches that search. Clear the filter to see all 21.</div>';
  return items.map(c => `<button class="cc ${P.concepts.includes(c.id) ? 'done' : ''}" data-a="concept" data-id="${c.id}" ${LS.sel === c.id ? 'aria-current="true" style="border-color:var(--cy);background:var(--s2)"' : ''}><span class="row" style="justify-content:space-between;gap:6px"><b style="font-family:var(--f-d);font-size:13px">${esc(c.title)}</b>${P.quizOk.includes(c.id) ? '<span class="chip ok">✓ quiz</span>' : P.concepts.includes(c.id) ? '<span class="chip">explored</span>' : ''}</span><small>${esc(c.g)}</small></button>`).join('');
}
ACT.qans = el => { const c = cur(), k = +el.dataset.k; LS.quiz[c.id] = { pick: k, shown: true }; if (k === c.q.a && !P.quizOk.includes(c.id)) { P.quizOk.push(c.id); SES.challenges++; P.challenges++; addXP(15, 'knowledge check'); } render(); };
ACT.qshow = () => { const c = cur(); LS.quiz[c.id] = Object.assign({ pick: null }, LS.quiz[c.id], { shown: true }); render(); };
ACT.qreset = () => { delete LS.quiz[cur().id]; render(); };
function conceptDetail() {
  const c = cur(); if (!c) return '';
  const qz = LS.quiz[c.id] || {}, done = qz.shown;
  return `<div class="card hi" id="concept"><div class="row" style="justify-content:space-between"><div><span class="chip vi">${esc(c.g)}</span><h2 style="font-size:20px;margin-top:6px">${esc(c.title)}</h2></div><button class="btn sm" data-a="playc" data-g="${c.game}">${icon('play')}Play ${esc(GT.GAMES[c.game].short)}</button></div>
  <p style="margin-top:8px;font-size:15px">${esc(c.def)}</p>
  <div class="grid g2" style="margin-top:10px"><div><div class="lbl">Real-world example</div><p class="sm muted" style="margin-top:3px">${esc(c.ex)}</p></div><div><div class="lbl">In the playground</div><p class="sm muted" style="margin-top:3px">${esc(GT.GAMES[c.game].name)}: ${esc(GT.GAMES[c.game].line)}</p></div></div>
  <div class="card" style="margin-top:12px;background:var(--bg)"><div class="lbl" style="margin-bottom:6px">Interactive demonstration</div>${demoHTML(c)}</div>
  <div class="callout red" style="margin-top:12px"><b>Common misconception.</b> ${esc(c.mis)}</div>
  <details style="margin-top:10px" ${lvl() === 'advanced' ? 'open' : ''}><summary>Optional: formal notation and advanced note</summary><div><p class="mono sm" style="margin-top:4px">${esc(c.formal)}</p><p class="sm" style="margin-top:6px">${esc(c.adv)}</p></div></details>
  <div class="card" style="margin-top:12px;background:var(--bg)"><div class="lbl">Knowledge check</div><p style="margin-top:4px"><b>${esc(c.q.t)}</b></p>
  ${c.q.o.map((o, k) => `<button class="opt ${done ? (k === c.q.a ? 'good' : qz.pick === k ? 'bad' : '') : ''}" data-a="qans" data-k="${k}" ${done ? 'disabled' : ''}>${esc(o)}${done && k === c.q.a ? ' ✓' : ''}${done && qz.pick === k && k !== c.q.a ? ' ✗' : ''}</button>`).join('')}
  <div class="row" style="margin-top:8px">${done ? `<button class="btn sm" data-a="qreset">Try again</button>` : `<button class="btn sm" data-a="qshow">Show answer</button>`}</div>
  ${done ? `<div class="callout ${qz.pick === c.q.a ? 'ok' : ''}" style="margin-top:8px" aria-live="polite"><b>${qz.pick === c.q.a ? 'Correct.' : qz.pick === null || qz.pick === undefined ? 'Answer:' : 'Not quite.'}</b> ${c.q.o[c.q.a] ? 'The answer is “' + esc(c.q.o[c.q.a]) + '”. ' : ''}${esc(c.q.why)}</div>` : ''}</div></div>`;
}
ACT.playc = el => openGame(el.dataset.g);
function conceptsTab() {
  markExplored(LS.sel);
  return `<div class="learn"><div class="col" style="gap:8px"><input type="text" id="lsearch" data-i="lsearch" placeholder="Search concepts" value="${esc(LS.q)}" aria-label="Search concepts"><div class="seg" role="group" aria-label="Filter by level" style="max-width:100%"><button data-a="grp" data-g="all" aria-pressed="${LS.grp === 'all'}">All</button>${GROUPS.map(g => `<button data-a="grp" data-g="${g}" aria-pressed="${LS.grp === g}">${g === 'Strategic concepts' ? 'Strategic' : g}</button>`).join('')}</div><div class="col" style="gap:6px;max-height:640px;overflow:auto;padding-right:2px" id="clist">${conceptList()}</div>
  <div class="card"><h3>Sources</h3><p class="sm muted" style="margin-top:6px">Verified references for every concept are on the References tab.</p><button class="btn sm" style="margin-top:8px" data-a="ltab" data-t="refs">Open references</button></div></div><div>${conceptDetail()}</div></div>`;
}

const KIND = {

const kindChip = k => `<span class="chip ${KIND[k][1]}" title="${esc(KIND[k][2])}">${KIND[k][0]}</span>`;
function kindLegend() {
  return `<div class="card"><h3>How claims are labelled</h3><div class="col" style="gap:8px;margin-top:8px">${Object.keys(KIND).map(k => `<div class="row" style="align-items:flex-start;gap:10px">${kindChip(k)}<span class="sm muted">${esc(KIND[k][2])}</span></div>`).join('')}</div></div>`;
}

const SEC = { mcq: 'Concepts', mat: 'Matrix interpretation', ne: 'Nash identification', scen: 'Strategic scenarios' };
const cellName = (M, i, j) => `(${M.rows[i]}, ${M.cols[j]})`;
const MX = {
  pd: GT.GAMES.pd.M, chicken: GT.GAMES.chicken.M, stag: GT.GAMES.stag.M, bos: GT.GAMES.bos.M, mp: GT.GAMES.mp.M,
  d3: GT.mk(['Top', 'Middle', 'Bottom'], ['Left', 'Centre', 'Right'], [[[2, 3], [4, 1], [1, 2]], [[3, 2], [1, 4], [5, 5]], [[1, 1], [2, 0], [0, 3]]]),
  dom: GT.mk(['Up', 'Down'], ['Left', 'Right'], [[[4, 2], [3, 0]], [[1, 3], [2, 1]]]),

function single(sec, t, opts, a, extra = {}) { return Object.assign({ sec, kind: 'single', t, opts: opts.map(o => o[0]), why: opts.map(o => o[1]), correct: [a] }, extra); }
function neQuestion(key, t) {
  const M = MX[key], an = GT.analyze(M), opts = [], why = [], correct = [];
  M.rows.forEach((r, i) => M.cols.forEach((c, j) => {
    const cl = an.cells[i][j]; opts.push(cellName(M, i, j));
    why.push(cl.ne ? `Equilibrium: ${M.rows[i]} is a best response to ${M.cols[j]}, and ${M.cols[j]} is a best response to ${M.rows[i]}.` : `Not an equilibrium: ${!cl.br1 ? 'the row player' : 'the column player'} has a better reply (${!cl.br1 ? 'row' : 'column'} best-response check fails).`);

  }));
  opts.push('No pure-strategy equilibrium'); why.push(an.ne.length ? 'There is at least one pure equilibrium, so this is wrong.' : 'Correct: every cell has a profitable deviation for one player, so only a mixed equilibrium exists.');
  if (!an.ne.length) correct.push(opts.length - 1);
  return { sec: 'ne', kind: 'multi', t, M, opts, why, correct, none: opts.length - 1 };
}
function buildAssess() {
  const q = [];
  // Section 1: concepts (8)
  q.push(single('mcq', 'A Nash equilibrium is best described as:', [['The outcome with the highest total payoff.', 'Totals are the criterion for efficiency, not equilibrium.'], ['A set of strategies where no player can gain by changing only their own strategy.', 'Correct. This is the definition of (pure-strategy) Nash equilibrium.'], ['The strategy each player plays most often.', 'Frequency of play is empirical, not a definition.'], ['The outcome where players cooperate.', 'Equilibria can involve cooperation or not: in the Prisoner’s Dilemma it is mutual defection.']], 1));

  q.push(single('mcq', 'Pareto efficiency and Nash equilibrium are:', [['The same thing.', 'The Prisoner’s Dilemma separates them: its equilibrium is Pareto dominated.'], ['Different properties: an equilibrium can be inefficient and an efficient outcome need not be an equilibrium.', 'Correct.'], ['Only relevant in zero-sum games.', 'In zero-sum games every outcome is Pareto efficient, which makes the contrast trivial.'], ['Both guaranteed to exist for every game.', 'Pure equilibria need not exist; efficient outcomes always do in finite games, but they are not guaranteed to be stable.']], 1));
  q.push(single('mcq', 'In a 2×2 mixed equilibrium, each player’s probabilities are chosen so that:', [['The player’s own payoff is maximized in every round.', 'Realized payoffs vary with chance. Expected payoff is what matters.'], ['The other player is indifferent between their pure strategies.', 'Correct. That indifference is what makes randomizing a best response for the other player.'], ['Both players pick each action with probability 1/2.', 'Only in symmetric games such as Matching Pennies.'], ['The outcome is Pareto efficient.', 'Mixed equilibria are often inefficient.']], 1));
  q.push(single('mcq', 'Backward induction requires you to start by analysing:', [['The first move.', 'You can only judge it after knowing what follows.'], ['The final decision nodes.', 'Correct. Solve the last decisions, then move one step back.'], ['The player with the most strategies.', 'The count of strategies is irrelevant.'], ['The highest payoff in the tree.', 'Highest payoffs are not necessarily reachable if play is optimal.']], 1));
  q.push(single('mcq', 'In a finitely repeated Prisoner’s Dilemma with a known last round, backward induction predicts:', [['Cooperation in every round.', 'Defection in the last round unravels cooperation earlier. That is the standard result.'], ['Defection in every round.', 'Correct. The last round is a one-shot game, so defect; then the second-last round has no future to protect, and so on.'], ['Random play.', 'No randomization is required.'], ['Cooperation until the last round.', 'This is a common human pattern in experiments, but it is not the subgame-perfect prediction.']], 1));
  q.push(single('mcq', 'The STRATAGEM Tit-for-Tat opponent:', [['Is a machine-learning model.', 'No. It is a fixed rule.'], ['Cooperates in round 1, then copies your previous move.', 'Correct. That is the entire rule, and it is listed on the Docs page.'], ['Computes the Nash equilibrium.', 'Tit-for-Tat does not.'], ['Adapts its rule to each player.', 'There is no adaptation.']], 1));
  // Section 2: matrix interpretation (4) - answers computed by the engine
  { const M = MX.pd, v = M.pay[1][0][1], opts = [...new Set([0, 1, 3, 5, v])].sort((a, b) => a - b); q.push(single('mat', `Prisoner’s Dilemma (cell = You, Opponent). What payoff does the Opponent get when you Defect and they Cooperate?`, opts.map(x => [String(x), x === v ? `Correct: cell (Defect, Cooperate) reads (${M.pay[1][0].join(', ')}); the Opponent’s payoff is the second number.` : `The cell (Defect, Cooperate) is (${M.pay[1][0].join(', ')}); the opponent’s payoff is ${v}, not ${x}.`]), opts.indexOf(v), { M })); }
  { const M = MX.chicken, v = M.pay[0][1][0] >= M.pay[1][1][0] ? 0 : 1, nm = M.rows[v];
    q.push(single('mat', 'Chicken (cell = You, Opponent). If you are sure the Opponent will Stay Straight, what is your best response?', M.rows.map((r, i) => [r, i === v ? `Correct: against Stay Straight you get ${M.pay[0][1][0]} by swerving and ${M.pay[1][1][0]} by staying straight, so ${nm} is better.` : `Against Stay Straight you would get ${M.pay[i][1][0]} here versus ${M.pay[v][1][0]} from ${nm}.`]), v, { M })); }
  { const M = MX.dom, d = GT.dominance(M), r = d.p1.find(x => x.strict), nm = r ? M.rows[r.dom] : null;
    const opts = [...M.rows, 'Neither row dominates'], a = r ? r.dom : 2;
    q.push(single('mat', 'In this matrix (cell = You, Opponent), does one of your rows strictly dominate the other?', opts.map((o, i) => [o, i === a ? (r ? `Correct: ${nm} beats ${M.rows[r.sub]} in every column (${M.pay[r.dom].map(c => c[0]).join(' and ')} versus ${M.pay[r.sub].map(c => c[0]).join(' and ')}).` : 'Correct: neither row is better in every column.') : 'Compare the row player’s payoffs column by column. ' + (r ? `${nm} is higher in both columns.` : 'No row is strictly higher in every column.')]), a, { M })); }
  { const M = MX.bos, n = GT.analyze(M).ne.length, opts = [0, 1, 2, 3, 4], idx = opts.indexOf(n);

  q.push(neQuestion('d3', 'Select every pure-strategy Nash equilibrium in this 3×3 game.'));
  q.push(neQuestion('mp', 'Select every pure-strategy Nash equilibrium in this Matching Pennies game.'));
  // Section 4: scenarios (4)
  q.push(single('scen', 'Two rival cafés each choose High or Low prices at the same time. Both earn more if both choose High, but each earns still more by undercutting a rival who prices High. What is the most accurate analysis?', [['They will price High because it is best for both.', 'Joint benefit does not make an outcome stable. Each café still gains by undercutting.'], ['Low pricing is a dominant strategy, so (Low, Low) is the equilibrium even though (High, High) pays both more. This is a Prisoner’s Dilemma structure.', 'Correct. The model assumption is that payoffs have this ordering. The prediction follows from it.'], ['The outcome is random.', 'Nothing in the description implies randomization.'], ['Whoever prices first wins.', 'The game is simultaneous.']], 1));
  q.push(single('scen', 'An incumbent firm says it will start a ruinous price war if a rival enters. If the rival enters, the war would cost the incumbent more than accommodating. What should the rival conclude?', [['Stay out: the threat deters entry.', 'Only if the threat is credible. Here carrying it out hurts the threatener.'], ['Enter: backward induction shows the incumbent would accommodate, so the threat is not credible.', 'Correct. Subgame-perfect reasoning removes threats a player would not carry out. The rival still needs the model’s payoffs to be right.'], ['It depends only on how loudly the incumbent says it.', 'Cheap talk does not change payoffs.'], ['Mix between entering and staying out.', 'A pure best response exists, so no mixing is needed.']], 1));

const asReady = () => LT.as && !LT.as.done;

const CL = { game: 'pd', opp: 'tft', oppMode: 'policy', br: false, ne: false, pe: false, row: null, col: null, hist: [], cu: 0, cv: 0, last: null, rnd: GT.rng(20261023), sim: null, rule: 'half', n: 50, back: 'home', seed: 1 };

  return an;
}
function clTheory(M) {
  const an = GT.analyze(M), mx = M.rows.length === 2 && M.cols.length === 2 ? GT.mixed2x2(M) : null;
  let dist = null, note;
  if (an.ne.length === 1) { dist = M.rows.map(() => M.cols.map(() => 0)); dist[an.ne[0][0]][an.ne[0][1]] = 1; note = 'One pure Nash equilibrium: theory predicts it every round.'; }
  else if (!an.ne.length && mx && mx.valid) { dist = [[mx.p * mx.q, mx.p * (1 - mx.q)], [(1 - mx.p) * mx.q, (1 - mx.p) * (1 - mx.q)]]; note = `No pure equilibrium. The mixed equilibrium plays ${M.rows[0]} with probability ${fmt(mx.p)} and ${M.cols[0]} with probability ${fmt(mx.q)}, so each cell has the product probability.`; }

function clSimulate() {
  const M = clM(), pol = clPolicy(), rnd = GT.rng(1000 + (CL.seed++)), th = clTheory(M);
  const hist = [], cnt = M.rows.map(() => M.cols.map(() => 0)); let u = 0, v = 0, neHits = 0;

/* ================= THE FOUR-CARD DUEL: UI, animation sequencing =================

/* ================= FOUR-CARD DUEL: round history, final results, saved matches, profile statistics ================= */
// Saved matches store only the choices; points, winners and explanations are re-derived with the same scoring engine (one scoring system everywhere).
function expandMatch(m) {
  const cfg = DUEL.normCfg(m.cfg); let cr = 0, cb = 0;
  return m.rounds.map((x, i) => { const s = DUEL.score(cfg, x[0], x[1]); cr += s.red.points; cb += s.black.points; return { n: i + 1, red: x[0], black: x[1], rp: s.red.points, bp: s.black.points, match: s.match, winner: s.winner, cumR: cr, cumB: cb, why: DUEL.explain(cfg, x[0], x[1]) }; });
}
const matchesStore = () => (P.duel && P.duel.matches) || [];
function histSource(src) {
  if (src === 'cur') return D.g ? { R: D.g.rounds, cfg: D.g.cfg, cur: D.g.cur && D.phase !== 'result' && D.phase !== 'revealing' ? D.g.cur.n : 0 } : null;
  const m = matchesStore()[D.savedSel]; return m ? { R: expandMatch(m), cfg: DUEL.normCfg(m.cfg), cur: 0 } : null;
}
function duelHistHTML(src) {
  const h = histSource(src); if (!h) return '';
  const R = h.R, f = D.filter;
  const ok = r => f === 'all' || (f === 'red' && r.winner === 'red') || (f === 'black' && r.winner === 'black') || (f === 'match' && r.match) || (f === 'diff' && !r.match);
  const rows = R.filter(ok), sel = D.insp ? R.find(r => r.n === D.insp) : null;
  const chips = [['all', 'All'], ['red', 'Red wins'], ['black', 'Black wins'], ['match', 'Matching ranks'], ['diff', 'Different ranks']].map(c => `<button data-a="dfilter" data-f="${c[0]}" data-src="${src}" aria-pressed="${f === c[0]}">${c[1]}</button>`).join('');
  return `<div class="sec-h"><h3>Round history</h3><span class="xs muted">${R.length} of ${DUEL.ROUNDS} completed</span></div><div class="seg" role="group" aria-label="Filter rounds" style="max-width:100%;margin:6px 0;flex-wrap:wrap">${chips}</div>
  <p class="xs muted" style="margin-bottom:6px">Under these rules a Red win is always a matching round and a Black win is always a round with different ranks, so those filters list the same rounds.</p>
  ${sel ? `<div class="callout" style="margin:8px 0"><div class="row" style="gap:10px;align-items:center">${miniCard(sel.red, 'lg')}${miniCard(sel.black, 'lg')}<div><b>Round ${sel.n}</b> · Red ${rankName(sel.red)} vs Black ${rankName(sel.black)}<br><span class="mono">Red +${fmt(sel.rp)} · Black +${fmt(sel.bp)} · totals ${fmt(sel.cumR)}–${fmt(sel.cumB)}</span></div></div><div class="xs muted" style="margin-top:6px">${esc(sel.why)}</div></div>` : ''}
  <div class="hlist" role="list">${rows.length ? rows.map(r => `<button class="hrow ${D.insp === r.n ? 'sel' : ''}" role="listitem" data-a="dinsp" data-n="${r.n}" data-src="${src}" aria-label="Round ${r.n}: Red ${rankName(r.red)}, Black ${rankName(r.black)}, ${r.winner} scores ${fmt(r.winner === 'red' ? r.rp : r.bp)}, totals ${fmt(r.cumR)} to ${fmt(r.cumB)}"><span class="mono n">${pad(r.n)}</span>${miniCard(r.red)}${miniCard(r.black)}<span class="pts"><b class="rc ${r.rp ? 'on' : ''}">Red +${fmt(r.rp)}</b><b class="bc ${r.bp ? 'on' : ''}">Black +${fmt(r.bp)}</b></span><span class="mono xs muted tot">${fmt(r.cumR)}–${fmt(r.cumB)}</span></button>`).join('') : `<div class="muted sm" style="padding:8px">${R.length ? 'No rounds match this filter.' : 'Completed rounds appear here. Click one to inspect it.'}</div>`}${h.cur ? `<div class="hrow now" aria-label="Current round"><span class="mono n">${pad(h.cur)}</span><span class="xs muted">current round in progress (choices hidden)</span></div>` : ''}</div>`;
}
ACT.dfilter = el => { D.filter = el.dataset.f; setH(el.dataset.src === 'cur' ? 'd-hist' : 's-hist', duelHistHTML(el.dataset.src)); };
ACT.dinsp = el => { D.insp = D.insp === +el.dataset.n ? null : +el.dataset.n; setH(el.dataset.src === 'cur' ? 'd-hist' : 's-hist', duelHistHTML(el.dataset.src)); };

/* ---------- charts ---------- */
function chartSVG(R, cfg) {
  const W = 560, H = 220, m = { l: 34, r: 12, t: 12, b: 26 }, mx = Math.max(1, ...R.map(r => Math.max(r.cumR, r.cumB))), sx = i => m.l + (i / DUEL.ROUNDS) * (W - m.l - m.r), sy = v => H - m.b - (v / mx) * (H - m.t - m.b);
  const path = k => R.reduce((s, r, i) => s + 'L' + sx(i + 1).toFixed(1) + ' ' + sy(r[k]).toFixed(1), `M${sx(0)} ${sy(0)}`);
  const stp = Math.max(1, Math.ceil(mx / 5)), ticks = []; for (let t = 0; t <= mx + 1e-9; t += stp) ticks.push(t);
  const last = R[R.length - 1] || { cumR: 0, cumB: 0 };
  return `<svg viewBox="0 0 ${W} ${H}" class="dchart" role="img" aria-label="Cumulative score by round. Red ends at ${fmt(last.cumR)}, Black at ${fmt(last.cumB)}."><g stroke="rgba(167,178,200,.14)">${ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${sy(t)}" y2="${sy(t)}"/>`).join('')}</g><g fill="#7F8CA6" font-size="10" font-family="JetBrains Mono">${ticks.map(t => `<text x="${m.l - 6}" y="${sy(t) + 3}" text-anchor="end">${fmt(t)}</text>`).join('')}${[0, 5, 10, 15, 20].map(i => `<text x="${sx(i)}" y="${H - 8}" text-anchor="middle">${i}</text>`).join('')}</g><path d="${path('cumB')}" fill="none" stroke="#d6dcec" stroke-width="5" stroke-linejoin="round" class="draw" pathLength="1000"/><path d="${path('cumR')}" fill="none" stroke="#FF6B6B" stroke-width="2.4" stroke-linejoin="round" class="draw" pathLength="1000"/></svg>`;
}
function freqRows(fr, fb) { // counts of each rank per player, with the 25% marker
  return DUEL.RANKS.map(k => `<div class="fq"><span>${rankName(k)}</span><div class="fqt"><i class="r" style="width:${fr[k] / DUEL.ROUNDS * 100}%"></i><i class="b" style="width:${fb[k] / DUEL.ROUNDS * 100}%"></i><u style="left:25%"></u></div><span class="mono xs"><b class="rc">${fr[k]}</b> · <b class="bc">${fb[k]}</b></span></div>`).join('');
}
function distRow(label, counts) { const n = sum(counts) || 1; return `<tr><td>${label}</td>${counts.map(c => `<td class="mono">${c} <span class="xs muted">(${Math.round(c / n * 100)}%)</span></td>`).join('')}</tr>`; }

/* ---------- final results ---------- */
function resultsHTML() {
  const g = D.g, s = DUEL.summary(g), th = DUEL.theory(g.cfg), cpu = g.mode === 'cpu', R = g.rounds;
  const head = s.leader === 'tie' ? 'It’s a draw' : cpu ? (s.leader === g.role ? 'You win' : 'Computer wins') : sideName(s.leader) + ' Player wins';
  const st = (l, v, c) => `<div class="stat"><span class="lbl">${l}</span><b class="mono ${c || ''}">${v}</b></div>`;
  const cnt = (k, n) => DUEL.RANKS.map(r => s[k][r]);
  const rows = [['Red', 'red', 'freqRed'], ['Black', 'black', 'freqBlack']].map(([nm, w, k]) => { const c = DUEL.RANKS.map(r => s[k][r]), dist = c.map(x => x / s.n), ex = DUEL.exploitability(g.cfg, w, dist); return `<tr><td><b class="${w === 'red' ? 'rc' : 'bc'}">${nm}${cpu ? (w === g.role ? ' (you)' : ' (computer)') : ''}</b></td>${c.map(x => `<td class="mono">${x}</td>`).join('')}<td class="mono">${ex.gain > 1e-9 ? '+' + fmt(+ex.gain.toFixed(3)) : '0'}</td></tr>`; }).join('');
  const dev = (obs, ev, sd) => (sd > 0 ? Math.abs(obs - ev) / sd : 0);
  const zr = dev(s.red, th.evRed20, th.sdRed20 * 1);
  const note = `Over ${s.n} rounds Red scored ${fmt(s.red)} and Black ${fmt(s.black)}. If both players mixed evenly over the four ranks, the expected totals would be ${fmt(+th.evRed20.toFixed(2))} for Red and ${fmt(+th.evBlack20.toFixed(2))} for Black, with a typical spread of about ±${fmt(+th.sdRed20.toFixed(1))} and ±${fmt(+th.sdBlack20.toFixed(1))} points. ${s.matchRounds} of ${s.n} rounds matched (${Math.round(s.matchRounds / s.n * 100)}%; 25% is expected from even mixing). Twenty rounds is a small sample: this result is about ${fmt(+zr.toFixed(1))} standard deviation(s) from that expectation, which shows what happened in this match, not that one strategy is better.`;
  return `<div class="card hi dres"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><div><span class="chip am">Final result</span><h2 class="${s.leader === 'tie' ? '' : s.leader}" style="font-size:28px;margin-top:6px">${esc(head)}</h2></div><div class="mono" style="font-size:34px"><span class="rc">${fmt(s.red)}</span> <span class="muted">–</span> <span class="bc">${fmt(s.black)}</span></div></div>
  <div class="grid g4" style="margin-top:12px">${st('Rounds won · Red', s.redWins)}${st('Rounds won · Black', s.blackWins)}${st('Matching-rank rounds', s.matchRounds)}${st('Different-rank rounds', s.diffRounds)}</div>
  <div class="grid g2" style="margin-top:12px"><div><div class="lbl">Cumulative score by round</div>${chartSVG(R, g.cfg)}<div class="legend"><span><b style="color:#FF6B6B">━</b> Red</span><span><b style="color:#d6dcec">━</b> Black</span></div></div>
  <div><div class="lbl">Cards played (each player, 20 rounds)</div>${freqRows(s.freqRed, s.freqBlack)}<p class="xs muted" style="margin-top:4px"><b class="rc">Red</b> · <b class="bc">Black</b> counts. Dashed line = 25%, the equilibrium share of each rank.</p></div></div>
  <div class="card" style="margin-top:12px"><h3>Strategy analysis summary</h3><div class="tw"><table class="t" style="margin-top:8px"><thead><tr><th>Player</th>${DUEL.RANKS.map(r => `<th>${rankName(r)}</th>`).join('')}<th>Opponent’s gain / round if it knew these frequencies</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="sm" style="margin-top:8px">${esc(note)}</p><p class="xs muted" style="margin-top:6px">The last column is exploitability: how much an opponent who knew a player’s exact 20-round frequencies could gain per round over equilibrium play. Even random play gives uneven counts in 20 rounds, so a nonzero value is normal. It does not mean the player erred. In the equilibrium (25% each) it is exactly 0.</p></div>
  <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn pri" data-a="dstart">${icon('refresh')}Play Again</button><button class="btn" data-a="dreview">Review History</button><button class="btn" data-a="duelTab" data-t="analysis">${icon('lab')}Analyze Strategies</button><button class="btn" data-a="dsetup">Change setup</button><button class="btn" data-a="dhome">Return Home</button></div></div>`;
}

/* ---------- saved matches ---------- */
const MODE_LBL = m => (m.mode === 'two' ? 'Two players' : `vs ${DUEL.POLICIES[m.opp] ? DUEL.POLICIES[m.opp].name : m.opp}`);
function matchResult(m) {
  const R = expandMatch(m), last = R[R.length - 1] || { cumR: 0, cumB: 0 }, lead = last.cumR > last.cumB ? 'red' : last.cumB > last.cumR ? 'black' : 'tie';
  return { R, red: last.cumR, black: last.cumB, lead, human: m.mode === 'cpu' ? (lead === 'tie' ? 'draw' : lead === m.role ? 'win' : 'loss') : null };
}
// Only real saved data feeds these numbers (used by the profile page).
function duelStats() {
  const M = matchesStore(), o = { played: M.length, cpu: 0, two: 0, wins: 0, losses: 0, draws: 0, points: 0, rounds: 0, byRole: { red: [0, 0, 0], black: [0, 0, 0] }, favMode: null, last: null };
  M.forEach(m => { const r = matchResult(m); o.rounds += r.R.length; if (m.mode === 'cpu') { o.cpu++; o.points += m.role === 'red' ? r.red : r.black; const i = r.human === 'win' ? 0 : r.human === 'loss' ? 1 : 2; o.byRole[m.role][i]++; if (r.human === 'win') o.wins++; else if (r.human === 'loss') o.losses++; else o.draws++; } else o.two++; });
  o.favMode = !o.played ? null : o.cpu >= o.two ? 'Play vs Computer' : 'Two players, one device'; o.last = M.length ? M[M.length - 1].t : null; return o;
}
function savedHTML() {
  const M = matchesStore().map((m, i) => ({ m, i })).reverse(), st = duelStats(), legacy = (P.duel.games || []).length;
  const csv = ['match,time,mode,your_side,opponent,red_match_pts,black_diff_pts,round,red_card,black_card,winner,red_points,black_points,red_total,black_total'].concat(matchesStore().flatMap((m, mi) => expandMatch(m).map(r => [mi + 1, m.t, m.mode, m.mode === 'cpu' ? m.role : '', m.mode === 'cpu' ? m.opp : '', m.cfg.matchPts, m.cfg.diffPts, r.n, r.red, r.black, r.winner, r.rp, r.bp, r.cumR, r.cumB].join(',')))).join('\n');
  if (D.savedSel !== null && !matchesStore()[D.savedSel]) D.savedSel = null;
  const sel = D.savedSel !== null ? matchesStore()[D.savedSel] : null;
  return `<div class="col"><div class="callout">Finished matches are saved in this browser only. A match in progress is kept separately and never mixed into these results.${legacy ? ` ${legacy} game${legacy === 1 ? '' : 's'} from the earlier random-draw version are still stored but not listed, because they used different rules.` : ''}</div>
  ${M.length ? `<div class="grid g4"><div class="stat"><span class="lbl">Matches saved</span><b class="mono">${st.played}</b></div><div class="stat"><span class="lbl">Vs computer: W / L / D</span><b class="mono">${st.wins} / ${st.losses} / ${st.draws}</b></div><div class="stat"><span class="lbl">Two-player matches</span><b class="mono">${st.two}</b></div><div class="stat"><span class="lbl">Rounds played</span><b class="mono">${st.rounds}</b></div></div>
  <div class="card"><div class="sec-h"><h3>Completed matches</h3><span class="chip">${M.length}</span></div><div class="tw"><table class="t" style="margin-top:8px"><thead><tr><th>Date</th><th>Mode</th><th>Result</th><th>Red</th><th>Black</th><th>Points</th><th></th></tr></thead><tbody>${M.map(({ m, i }) => { const r = matchResult(m); return `<tr><td>${esc(new Date(m.t).toLocaleString())}</td><td>${esc(MODE_LBL(m))}${m.mode === 'cpu' ? ` <span class="xs muted">(you: ${sideName(m.role)})</span>` : ''}</td><td>${m.mode === 'cpu' ? (r.human === 'win' ? 'You won' : r.human === 'loss' ? 'You lost' : 'Draw') : (r.lead === 'tie' ? 'Draw' : sideName(r.lead) + ' won')}</td><td class="mono">${fmt(r.red)}</td><td class="mono">${fmt(r.black)}</td><td class="xs muted">Red ${fmt(m.cfg.matchPts)} · Black ${fmt(m.cfg.diffPts)}</td><td><button class="btn sm" data-a="dsvsel" data-n="${i}" aria-pressed="${D.savedSel === i}">Inspect</button></td></tr>`; }).join('')}</tbody></table></div>
  <div class="row" style="margin-top:10px;gap:8px">${D.confirmClear ? '<span class="xs">Delete all saved matches?</span><button class="btn red sm" data-a="dclear2">Yes, delete</button><button class="btn sm" data-a="dclearno">Cancel</button>' : '<button class="btn sm" data-a="dclear">Clear saved matches</button>'}</div></div>
  ${sel ? `<div class="card"><div class="sec-h"><h3>Match inspector</h3><span class="chip">${esc(MODE_LBL(sel))}</span></div><div id="s-hist">${duelHistHTML('sav')}</div></div>` : ''}
  <div class="card"><div class="sec-h"><h3>Export rounds (CSV)</h3></div><p class="xs muted">Downloads are not available in this preview, so copy the text instead.</p><textarea id="duel-csv" readonly aria-label="CSV of saved Four-Card Duel rounds" style="font:11.5px var(--f-m);min-height:160px;margin-top:6px">${esc(csv)}</textarea><div class="row" style="margin-top:8px;gap:8px"><button class="btn pri" data-a="copy" data-src="duel-csv">${icon('copy')}Copy CSV</button></div></div>` : '<div class="card muted">No finished matches yet. Play all 20 rounds to save one.</div>'}</div>`;
}
ACT.dsvsel = el => { D.savedSel = D.savedSel === +el.dataset.n ? null : +el.dataset.n; D.insp = null; D.filter = 'all'; render(true); };
ACT.dclear = () => { D.confirmClear = true; render(true); };
ACT.dclearno = () => { D.confirmClear = false; render(true); };
ACT.dclear2 = () => { P.duel.matches = []; D.confirmClear = false; D.savedSel = null; save(); render(true); toast('Saved matches deleted'); };

/* ================= FOUR-CARD DUEL: interactive strategy analysis =================
   Everything here is computed from DUEL (the same rules/scoring used in play) for the points entered in this tab.
   Three different things are kept apart on purpose: (1) the theoretical equilibrium, (2) observed card frequencies,
   (3) the result of one 20-round match. */
const ACFG = () => DUEL.normCfg(D.acfg);
const HUES = ['#45E6E0', '#9B7BFF', '#FFCA72', '#3DDC97'];
const SPEC_OPTS = [['equilibrium', 'Equilibrium Bot (25% each)'], ['random', 'Random Player'], ['pattern', 'Pattern Player'], ['adaptive', 'Adaptive Player'], ['fixed:A', 'Always Ace'], ['fixed:K', 'Always King'], ['fixed:2', 'Always 2'], ['fixed:3', 'Always 3'], ['mix', 'My mixture (sliders above)']];
const specLabel = s => (SPEC_OPTS.find(o => o[0] === s) || [0, s])[1].replace(/ \(.*\)/, '');
function specOf(s, side) { return s === 'mix' ? DUEL.normDist(D.mixw[side]) : s; }
function statDist(spec) { // stationary distribution of a strategy, or null when it depends on history
  if (Array.isArray(spec)) return spec; if (spec === 'equilibrium' || spec === 'random') return DUEL.uniform();
  if (typeof spec === 'string' && spec.startsWith('fixed:')) return DUEL.RANKS.map(r => (r === spec.slice(6) ? 1 : 0)); return null;
}
const pc = x => `${(x * 100).toFixed(1).replace(/\.0$/, '')}%`;
const hbar = (id, label, cls, w, txt) => `<div class="hb" id="${id}"><span>${label}</span><div class="hbt"><i class="${cls}" style="width:${w}%"></i></div><b class="mono">${txt}</b></div>`;

/* ---------- 1. model & matrix ---------- */
function modelHTML() {
  const cfg = ACFG(), eqPts = cfg.matchPts === cfg.diffPts, M = D.aview === 'points' ? DUEL.pointsMatrix(cfg) : DUEL.marginMatrix(cfg), an = GT.analyze(M);
  const a = fmt(cfg.matchPts), b = fmt(cfg.diffPts);
  const seg = (v, l) => `<button data-a="daview" data-v="${v}" aria-pressed="${D.aview === v}">${l}</button>`;
  return `<div class="sec-h"><h3>The payoff matrix ${kindChip('theory')}</h3><div class="seg" role="group" aria-label="Matrix view">${seg('margin', 'Strategic payoff (± margin)')}${seg('points', 'Points scored')}</div></div>
  ${matrix(M, { roles: ['Red', 'Black'], flags: true, an, cellClass: (i, j) => (i === j ? 'mt' : 'mm') })}
  <div class="legend" style="margin-top:6px"><span><b style="color:#FF6B6B">▮</b> Red matching cells (diagonal): Red scores</span><span><b style="color:#d6dcec">▮</b> Black mismatching cells: Black scores</span></div>
  <div class="grid g2" style="margin-top:10px"><div class="callout"><b>Per-round strategic payoff.</b> ${eqPts ? `With equal points the round is <b>zero-sum</b>: a match is +${a} for Red and −${a} for Black; a mismatch is −${b} for Red and +${b} for Black.` : `The game is analysed as a <b>score-margin</b> game: Red’s payoff is Red’s points minus Black’s points (+${a} on a match, −${b} otherwise), and Black’s payoff is the negative. That is zero-sum in margin. In raw points the totals differ (${a} or ${b} per round), so the “Points scored” view is not zero-sum.`} This is what the matrix above shows and what the equilibrium is computed from.</div>
  <div class="callout am"><b>Cumulative points are a different thing.</b> The match score is the running sum of points actually scored: Red gets ${a} each time the ranks match and Black gets ${b} each time they differ. After round <i>r</i>, Red has ${a}×(matches so far) and Black has ${b}×(mismatches so far). Strategic payoffs describe one round’s incentives; cumulative points describe the match.</div></div>
  <p class="sm" style="margin-top:8px">${an.ne.length ? 'There is a pure Nash equilibrium.' : '<b>No pure Nash equilibrium.</b>'} Red’s best reply to any Black rank is to copy it (the “BR·R” flags run down the diagonal). Black’s best reply to any Red rank is any of the other three (the “BR·B” flags). No cell is a best reply for both, so whoever is predictable can be beaten, and the only stable play is a mixture.</p>`;
}

/* ---------- 2. mixed-strategy lab ---------- */
function labHTML() {
  const side = (s, nm, cls) => `<div class="col"><h4 class="${cls}">${nm}</h4>${DUEL.RANKS.map((r, i) => `<div class="mixrow"><label for="mx-${s}-${i}">${rankName(r)}</label><input id="mx-${s}-${i}" type="range" min="0" max="100" step="1" value="${D.mixw[s][i]}" data-i="dmix" data-s="${s}" data-k="${i}" aria-label="${nm} weight for ${rankName(r)}"><b class="mono" id="mv-${s}-${i}">25%</b></div>`).join('')}
    <div class="stackbar" id="stack-${s}" aria-hidden="true" style="display:flex;height:12px;border-radius:99px;overflow:hidden;border:1px solid var(--line);margin-top:6px">${DUEL.RANKS.map((r, i) => `<i style="display:block;height:100%;width:25%;background:${HUES[i]};transition:width .35s ease"></i>`).join('')}</div>

function paintMixLab() {
  if (!$('#lab-out')) return; const cfg = ACFG(), p = DUEL.normDist(D.mixw.red), q = DUEL.normDist(D.mixw.black), e = DUEL.expected(cfg, p, q), r = DUEL.pureReplies(cfg, p, q), gp = DUEL.equilibriumGaps(cfg, p, q);
  const T = (id, t) => { const x = $('#' + id); if (x) x.textContent = t; };
  [['red', p], ['black', q]].forEach(([s, d]) => d.forEach((x, i) => { T(`mv-${s}-${i}`, pc(x)); const seg = $(`#stack-${s}`); if (seg) seg.children[i].style.width = (x * 100) + '%'; }));
  T('lr-pm', `${pc(e.pMatch)}`); T('lr-red', fmt(+e.red.toFixed(3))); T('lr-black', fmt(+e.black.toFixed(3))); T('lr-20', `${fmt(+(e.red * 20).toFixed(2))} / ${fmt(+(e.black * 20).toFixed(2))}`);
  const setBars = (pre, vals, mx) => { const best = Math.max(...vals); vals.forEach((v, i) => { const row = $(`#${pre}-${i}`); if (!row) return; row.classList.toggle('best', Math.abs(v - best) < 1e-9); row.querySelector('i').style.width = (mx > 0 ? v / mx * 100 : 0) + '%'; row.querySelector('b').textContent = fmt(+v.toFixed(3)); }); };
  setBars('rb', r.red, cfg.matchPts); setBars('bb', r.black, cfg.diffPts);
  const nm = arr => arr.map(rankName).join(' or ');
  const bestR = DUEL.RANKS.filter((_, i) => Math.abs(r.red[i] - Math.max(...r.red)) < 1e-9), bestB = DUEL.RANKS.filter((_, i) => Math.abs(r.black[i] - Math.max(...r.black)) < 1e-9);
  const eqNow = DUEL.isEquilibrium(cfg, p, q), eq = DUEL.equilibrium(cfg);
  const eqEl = $('#lr-eq'); if (eqEl) eqEl.innerHTML = eqNow ? `<b class="eqok">✔ Neither player can gain by switching.</b> With these mixtures Red’s best pure ranks (${nm(bestR)}) and Black’s (${nm(bestB)}) earn exactly what the mixtures earn, so this pair is a Nash equilibrium${p.every(x => Math.abs(x - .25) < 1e-9) && q.every(x => Math.abs(x - .25) < 1e-9) ? ' (the uniform one: 25% on each rank)' : ''}.` : `<b class="eqno">Not an equilibrium.</b> ${gp.red > 1e-9 ? `Red could gain +${fmt(+gp.red.toFixed(3))} per round by switching to ${nm(bestR)}. ` : ''}${gp.black > 1e-9 ? `Black could gain +${fmt(+gp.black.toFixed(3))} per round by switching to ${nm(bestB)}. ` : ''}The equilibrium itself is 25% on every rank for both players${eq.unique ? ' (and it is the only one for these points)' : ''}.`;
  const xr = DUEL.exploitability(cfg, 'red', p), xb = DUEL.exploitability(cfg, 'black', q), exEl = $('#lr-ex');
  if (exEl) exEl.innerHTML = `<b>Exploitability.</b> If Black knew Red’s mixture and best-responded, Black would earn <b class="mono">${fmt(+xr.best.toFixed(3))}</b> per round (equilibrium: ${fmt(+xr.equilibrium.toFixed(3))}), a gain of <b class="mono">${fmt(+Math.max(0, xr.gain).toFixed(3))}</b>. If Red knew Black’s mixture, Red would earn <b class="mono">${fmt(+xb.best.toFixed(3))}</b> (equilibrium ${fmt(+xb.equilibrium.toFixed(3))}), a gain of <b class="mono">${fmt(+Math.max(0, xb.gain).toFixed(3))}</b>. The gain is 0 only at 25% on every rank: any other mixture leaves something to exploit.`;

INP.dmix = el => { const s = el.dataset.s, k = +el.dataset.k; D.mixw[s][k] = +el.value; paintMixLab(); };
ACT.dpreset = el => {
  const s = el.dataset.s, v = el.dataset.v; let w;

// All choices ever made on one side, from saved matches plus the match in progress (completed rounds only).
function observedChoices(side) {

  matchesStore().forEach(m => add(m.rounds.map(r => ({ red: r[0], black: r[1] })))); if (D.g) add(D.g.rounds); return { c, n };

/* ---------- 3. equilibrium explanation ---------- */
function eqHTML() {
  const cfg = ACFG(), eq = DUEL.equilibrium(cfg), a = cfg.matchPts, b = cfg.diffPts, n = DUEL.RANKS.length;
  const ex1 = DUEL.exploitability(cfg, 'red', [.4, .2, .2, .2]), ex2 = DUEL.exploitability(cfg, 'black', [.4, .2, .2, .2]), th = DUEL.theory(cfg);
  const rowsR = eq.replies.red.map((x, i) => `<tr><td>Red plays ${rankName(DUEL.RANKS[i])}</td><td class="mono">${fmt(a)} × 1/4 = ${fmt(+x.toFixed(4))}</td></tr>`).join(''), rowsB = eq.replies.black.map((x, i) => `<tr><td>Black plays ${rankName(DUEL.RANKS[i])}</td><td class="mono">${fmt(b)} × 3/4 = ${fmt(+x.toFixed(4))}</td></tr>`).join('');
  return `<div class="sec-h"><h3>Why 25% on each rank is the equilibrium ${kindChip('theory')}</h3><span class="chip ${eq.verified ? 'ok' : ''}">${eq.verified ? 'verified numerically' : 'check failed'}</span></div>
  <p class="sm" style="margin-top:6px">Recomputed for <b>Red +${fmt(a)} on a match</b> and <b>Black +${fmt(b)} on different ranks</b>. Suppose Black plays each rank with probability 1/4. Whatever rank Red picks, it matches with probability 1/4, so every Red rank earns the same expected points: Red has no reason to prefer any rank. Likewise if Red plays 1/4 each, every Black rank differs with probability 3/4 and earns the same. Neither player gains by deviating, which is exactly what a Nash equilibrium means.</p>
  <div class="grid g2" style="margin-top:8px"><div class="tw"><table class="t"><thead><tr><th>Against Black’s 25% mixture</th><th>Red’s expected points</th></tr></thead><tbody>${rowsR}</tbody></table></div><div class="tw"><table class="t"><thead><tr><th>Against Red’s 25% mixture</th><th>Black’s expected points</th></tr></thead><tbody>${rowsB}</tbody></table></div></div>
  <p class="sm" style="margin-top:8px"><b>Equilibrium value per round:</b> Red ${fmt(+eq.redValue.toFixed(4))}, Black ${fmt(+eq.blackValue.toFixed(4))} points; over 20 rounds ${fmt(+th.evRed20.toFixed(2))} and ${fmt(+th.evBlack20.toFixed(2))}. In margin terms Red’s expected gain per round is ${fmt(+eq.marginValue.toFixed(4))}${eq.marginValue < 0 ? ', so equilibrium play favours Black under these points: Red needs the opponent to be predictable to do better.' : '.'} ${eq.unique ? 'For positive point values this equilibrium is <b>unique</b>.' : '<b>With a 0-point side the equilibrium is not unique</b> (that player is indifferent), although 25% each is still one.'}</p>
  <div class="callout am" style="margin-top:8px"><b>Why predictable play is exploitable.</b> If Red leans on one rank, for example 40% Ace and 20% each of the others, Black’s best reply is one of the 20% ranks: it differs with probability 80%, earning ${fmt(+ex1.best.toFixed(3))} per round instead of the equilibrium ${fmt(+ex1.equilibrium.toFixed(3))}, a gain of +${fmt(+ex1.gain.toFixed(3))}. If Black leans the same way, Red copies the favoured rank and gains +${fmt(+ex2.gain.toFixed(3))}. The more uneven the mixture, the bigger the gain, and it is largest for “always the same card”. Uniform mixing removes every such gain.</div>
  <div class="grid g3" style="margin-top:8px"><div class="callout cy"><b>Theoretical equilibrium</b><br><span class="sm">What perfect mixing guarantees on average. A fixed property of the rules, not of any match.</span></div><div class="callout vi"><b>Observed card frequencies</b><br><span class="sm">What players actually chose, over many rounds. They approach 25% only if the player really mixes.</span></div><div class="callout"><b>One 20-round match</b><br><span class="sm">A single small sample with large variance (Red’s total has a standard deviation of about ${fmt(+th.sdRed20.toFixed(1))} points). Winning or losing it does not prove a strategy better or worse.</span></div></div>
  <details class="adv-only" style="margin-top:8px"><summary class="sm"><b>Why it is the only equilibrium (sketch)</b></summary><p class="sm" style="margin-top:6px">In any equilibrium Red puts weight only on ranks that Black plays most often, and Black puts weight only on ranks that Red plays least often. If Black’s mixture were uneven, Red would play only its most likely ranks, so those ranks are never Red’s <i>least</i> likely ones, and Black would then avoid them, contradicting that they are Black’s most likely ranks. The only way out is for every rank to be equally likely for both players: 1/${n} each.</p></details>`;
}

/* ---------- 4. simulation ---------- */
function simSelect(id, val) { return `<select id="${id}" data-c="dsimsel" data-k="${id.slice(4)}" aria-label="${id}">${SPEC_OPTS.map(o => `<option value="${o[0]}" ${val === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`; }
function simHTML() {
  return `<div class="card"><div class="sec-h"><h3>Simulation: compare strategies ${kindChip('sim')}</h3></div><p class="sm muted" style="margin:4px 0 8px">Plays many full 20-round matches between two strategies with the points entered above. The computer opponents use only the rounds already played, never the current choice. Results are random, so they vary a little between runs.</p>
  <div class="row" style="gap:12px;flex-wrap:wrap;align-items:end"><label class="xs muted">Red uses<br>${simSelect('sim-red', D.simSel.red)}</label><label class="xs muted">Black uses<br>${simSelect('sim-black', D.simSel.black)}</label><label class="xs muted">Matches<br><select id="sim-n" data-c="dsimsel" data-k="n" aria-label="Number of matches">${[200, 1000, 5000].map(n => `<option value="${n}" ${D.simSel.n === n ? 'selected' : ''}>${n.toLocaleString()}</option>`).join('')}</select></label><button class="btn pri" data-a="dsim">Run simulation</button><button class="btn" data-a="dsimall">Compare against every opponent</button></div>
  <div id="sim-out" style="margin-top:10px" aria-live="polite">${D.sim ? simOutHTML() : '<p class="sm muted">Choose two strategies and run a simulation.</p>'}</div></div>`;
}
function runSim(redS, blackS, n) {

  let theo = null; if (pr && qr) { const pm = pr.reduce((s, x, i) => s + x * qr[i], 0); theo = { pm, red: DUEL.ROUNDS * cfg.matchPts * pm, black: DUEL.ROUNDS * cfg.diffPts * (1 - pm) }; }
  return { redS, blackS, n, cfg, res, theo, pr, qr };
}
function simOutHTML() {
  const s = D.sim, r = s.res, th = DUEL.theory(s.cfg), eq = s.theo, pctf = x => (x * 100).toFixed(1) + '%';
  const rows = DUEL.RANKS.map((k, i) => `<tr><td>${rankName(k)}</td><td class="mono">${pctf(r.freqRed[i])}${s.pr ? ` <span class="xs muted">(set ${pctf(s.pr[i])})</span>` : ''}</td><td class="mono">${pctf(r.freqBlack[i])}${s.qr ? ` <span class="xs muted">(set ${pctf(s.qr[i])})</span>` : ''}</td></tr>`).join('');

  <tr><td>Theoretical mean for these two strategies</td><td class="mono">${eq ? fmt(+eq.red.toFixed(2)) : 'n/a'}</td><td class="mono">${eq ? fmt(+eq.black.toFixed(2)) : 'n/a'}</td></tr>
  <tr><td>Equilibrium mean (both mix 25%)</td><td class="mono">${fmt(+th.evRed20.toFixed(2))}</td><td class="mono">${fmt(+th.evBlack20.toFixed(2))}</td></tr>
  <tr><td>Matches won / drawn</td><td class="mono">${pctf(r.redWinRate)}</td><td class="mono">${pctf(r.blackWinRate)} <span class="xs muted">(drawn ${pctf(r.drawRate)})</span></td></tr></tbody></table></div>

/* ---------- 5. observed vs theoretical ---------- */
function obsHTML() {
  const cfg = ACFG(), M = matchesStore(), rows = [];
  const addRounds = (label, rs, cfgs) => { if (!rs.length) return; const n = rs.length, mt = rs.filter(r => r.match).length, rp = rs.reduce((s, r) => s + r.rp, 0), bp = rs.reduce((s, r) => s + r.bp, 0), er = cfgs.reduce((s, c) => s + DUEL.theory(c).evRed, 0), eb = cfgs.reduce((s, c) => s + DUEL.theory(c).evBlack, 0); rows.push({ label, n, mt, rp, bp, er, eb }); };
  if (D.g && D.g.rounds.length) addRounds('Match in progress', D.g.rounds, D.g.rounds.map(() => D.g.cfg));
  if (M.length) { const all = M.flatMap(m => expandMatch(m).map(r => [r, DUEL.normCfg(m.cfg)])); addRounds(`All ${M.length} saved match${M.length === 1 ? '' : 'es'}`, all.map(x => x[0]), all.map(x => x[1])); }
  const mine = ['red', 'black'].map(s => { const ms = M.filter(m => m.mode === 'cpu' && m.role === s); const c = [0, 0, 0, 0]; ms.forEach(m => m.rounds.forEach(r => c[DUEL.RANKS.indexOf(r[s === 'red' ? 0 : 1])]++)); return { s, c, n: sum(c), m: ms.length }; }).filter(x => x.n);
  const body = rows.length ? `<div class="tw"><table class="t" style="margin-top:8px"><thead><tr><th></th><th>Rounds</th><th>Ranks matched (expected 25%)</th><th>Red: observed / expected if both mix evenly</th><th>Black: observed / expected</th></tr></thead><tbody>${rows.map(x => `<tr><td>${x.label}</td><td class="mono">${x.n}</td><td class="mono">${x.mt} (${Math.round(x.mt / x.n * 100)}%) <span class="xs muted">±${Math.round(Math.sqrt(.25 * .75 / x.n) * 100)}%</span></td><td class="mono">${fmt(x.rp)} / ${fmt(+x.er.toFixed(2))}</td><td class="mono">${fmt(x.bp)} / ${fmt(+x.eb.toFixed(2))}</td></tr>`).join('')}</tbody></table></div>` : '<p class="sm muted" style="margin-top:6px">Play a match to compare real results with the theory. Completed matches and the one in progress appear here.</p>';
  const mineT = mine.length ? `<h4 style="margin-top:10px">Your own choices in vs-computer matches</h4><div class="tw"><table class="t"><thead><tr><th>Side</th>${DUEL.RANKS.map(r => `<th>${rankName(r)}</th>`).join('')}</tr></thead><tbody>${mine.map(x => distRow(`${sideName(x.s)} (${x.m} match${x.m === 1 ? '' : 'es'})`, x.c)).join('')}</tbody></table></div>` : '';
  return `${body}${mineT}<p class="xs muted" style="margin-top:6px">Observed numbers come from rounds actually played. Expected numbers assume both players mix evenly (the equilibrium) with the points entered above. Small samples differ from expectation by chance; with 20 rounds per match a few points either way is normal and says nothing about which strategy is better.</p>`;
}

/* ================= ACCOUNTS, GUEST MODE, LOCAL DEMO PROFILE, PROFILE PAGES =================
   Three honest states:
   - guest:   default. Everything works; progress lives in this browser (localStorage).
   - demo:    a LOCAL demo profile (name + colour, NO password). Not an account, not secure, not synced. Separate local progress.
   - account: real sign-in, available ONLY when the build was configured with a Supabase project (SUPABASE_URL + SUPABASE_ANON_KEY).
              The browser talks to Supabase's GoTrue REST API. Passwords go straight to that service over HTTPS and are never stored,
              logged or kept in app state. Only the public anon key is embedded (it is public by design; a service-role key is refused at build time).
   Account progress is stored per account on THIS device. There is no cross-device sync in this version. */
const AUTH_CFG = {};
const authReady = () => !!(AUTH_CFG.url && AUTH_CFG.key);
const AUTH_KEY = 'stratagem.auth';
const AV_COLORS = ['#45E6E0', '#9B7BFF', '#FFCA72', '#FF7A7A', '#3DDC97', '#6EA8FF', '#FF9BD2', '#C7D0E6'];
const AU = { kind: 'guest', user: null, tab: 'overview', menu: false, busy: false, err: '', ok: '', next: null };
const emailOK = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
const initials = n => (String(n || '?').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2) || '?').toUpperCase();
const profName = () => (AU.kind === 'guest' ? 'Guest' : (P.profile && P.profile.name) || (AU.user && AU.user.email ? AU.user.email.split('@')[0] : 'Player'));
const profColor = () => AV_COLORS[(P.profile && P.profile.avatar) || 0] || AV_COLORS[0];

function authSave() { try { if (AU.kind === 'guest') localStorage.removeItem(AUTH_KEY); else localStorage.setItem(AUTH_KEY, JSON.stringify(AU.kind === 'demo' ? { kind: 'demo' } : { kind: 'account', user: AU.user, access: AU.access, refresh: AU.refresh, exp: AU.exp })); } catch (e) { } }
/* ---- Supabase GoTrue REST (only used when configured) ---- */
async function sbCall(path, body, token) {
  let r; try { r = await fetch(AUTH_CFG.url + path, { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json', apikey: AUTH_CFG.key }, token ? { Authorization: 'Bearer ' + token } : {}), body: JSON.stringify(body || {}) }); }
  catch (e) { throw new Error('NETWORK'); }
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.msg || j.error_description || j.message || j.error || 'HTTP ' + r.status); return j;
}
function friendly(m) {
  if (m === 'NETWORK') return 'Could not reach the sign-in service. Check your connection. You can keep playing as a guest meanwhile.';
  if (/invalid login|invalid_grant|invalid credentials/i.test(m)) return 'That email and password do not match. Check both and try again.';
  if (/already registered|already been registered|user_already_exists/i.test(m)) return 'An account with this email already exists. Try signing in instead.';
  if (/email not confirmed/i.test(m)) return 'Please confirm your email first: open the link we sent you, then sign in.';
  if (/password/i.test(m) && /(short|least|weak|characters)/i.test(m)) return 'That password is too weak. Use at least 8 characters.';
  if (/rate|too many|over_.*limit/i.test(m)) return 'Too many attempts. Wait a minute and try again.';
  return 'Something went wrong (' + m.slice(0, 80) + '). Please try again.';
}
function applySession(j, nameHint) {
  const u = j.user || {}, id = u.id || 'user';
  AU.kind = 'account'; AU.user = { id, email: u.email || '' }; AU.access = j.access_token; AU.refresh = j.refresh_token; AU.exp = Date.now() + (j.expires_in || 3600) * 1000;
  switchStore('stratagem.v1.u.' + id); const nm = (u.user_metadata && u.user_metadata.name) || nameHint;
  if (!P.profile) P.profile = { name: nm || (u.email || '').split('@')[0], avatar: 0 }; else if (nm && !P.profile.name) P.profile.name = nm; save(); authSave(); paintAcct();
}
async function authRefresh() { try { const j = await sbCall('/auth/v1/token?grant_type=refresh_token', { refresh_token: AU.refresh }); AU.access = j.access_token; AU.refresh = j.refresh_token || AU.refresh; AU.exp = Date.now() + (j.expires_in || 3600) * 1000; authSave(); return true; } catch (e) { return false; } }
function authInit() {

  let st = null; try { st = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) { }
  if (st && st.kind === 'demo') { AU.kind = 'demo'; switchStore('stratagem.v1.demo'); }
  else if (st && st.kind === 'account' && authReady() && st.user) { Object.assign(AU, { kind: 'account', user: st.user, access: st.access, refresh: st.refresh, exp: st.exp }); switchStore('stratagem.v1.u.' + st.user.id); if (AU.exp < Date.now() + 60000) authRefresh().then(ok => { if (!ok) { authLocalOut(); toast('Your session expired. Please sign in again.'); render(true); } }); }
  paintAcct();

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && AU.menu) { AU.menu = false; paintAcct(); const b = $('#acct-btn'); if (b) b.focus(); } if (e.key === 'Enter' && e.target.closest && e.target.closest('.authform') && e.target.tagName === 'INPUT') { e.preventDefault(); const b = $('.authform [data-a^=auth_do]'); if (b && !b.disabled) b.click(); } });
}
