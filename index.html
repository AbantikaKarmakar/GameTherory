}
PAGES.profile = () => {
  const kindLbl = AU.kind === 'account' ? `<span class="chip ok">Account · ${esc(AU.user.email)}</span>` : AU.kind === 'demo' ? '<span class="chip am">Local demo profile · not an account</span>' : '<span class="chip">Guest</span>';
  return `<div class="prof-h">${avatarHTML(64)}<div><h1 style="font-size:24px">${esc(profName())}</h1><div class="row" style="gap:8px;flex-wrap:wrap;margin-top:4px">${kindLbl}<span class="xs muted">Level ${level()}</span></div></div>${AU.kind === 'guest' ? '<div class="grow"></div><button class="btn pri" data-a="authopen">Sign in or create a profile</button>' : ''}</div>
  <div class="tabs" role="tablist" aria-label="Profile sections" style="margin:12px 0">${PTABS.map(t => `<button role="tab" data-a="proftab" data-t="${t[0]}" aria-selected="${AU.tab === t[0]}">${t[1]}</button>`).join('')}</div><div class="pbody">${profileBody()}</div>`;
};
ACT.proftab = el => { AU.tab = el.dataset.t; render(true); };
INP.pfname = el => { P.profile = P.profile || { avatar: 0 }; P.profile.name = el.value.slice(0, 30); save(); paintAcct(); const h = $('.prof-h h1'); if (h) h.textContent = profName(); const a = $('.prof-h .av'); if (a) a.textContent = initials(profName()); };
ACT.pfavatar = el => { P.profile = P.profile || {}; P.profile.avatar = +el.dataset.i; save(); paintAcct(); render(true); };
ACT.pfwipe = () => { AU.confirmWipe = true; render(true); };
ACT.pfwipeno = () => { AU.confirmWipe = false; render(true); };
ACT.pfwipe2 = () => { const prof = P.profile; P = JSON.parse(JSON.stringify(DEF)); if (prof) P.profile = prof; save(); AU.confirmWipe = false; D.g = null; D.phase = 'setup'; paintProfile(); render(true); toast('Local progress deleted.'); };

/* ================= DOCS: README, overview, deployment and opponent disclosure, embedded at build time ================= */
const DOCS = {"readme":"\u003ch2>STRATAGEM — The Game Theory Playground\u003c/h2>\u003cp>STRATAGEM is an interactive, browser-based learning tool for introductory and intermediate game theory. Students play six classic games against simple, fully disclosed opponents, edit payoff matrices and watch best responses and equilibria update, work through a structured learning pathway with quizzes, and take a final assessment. Everything runs in the browser. There is no backend, no account and no network call at run time.\u003c/p>\u003ch3>Objective and educational value\u003c/h3>\u003cul>\u003cli>Make the link between \u003cb>payoff numbers\u003c/b> and \u003cb>predictions\u003c/b> (best responses, dominance, Nash equilibrium, Pareto efficiency) visible by computing them live from whatever matrix is on screen.\u003c/li>\u003cli>Separate \u003cb>theory\u003c/b> (what follows from the payoffs), \u003cb>model assumptions\u003c/b> (rational players, these payoffs, this opponent rule) and \u003cb>simulated outcomes\u003c/b> (what one run of the program produced). The app labels each with a chip.\u003c/li>\u003cli>Give lecturers a classroom mode that reveals choices step by step and compares a theoretical prediction with a simulated run.\u003c/li>\u003c/ul>\u003ch3>Features\u003c/h3>\u003cdiv class=\"tw\">\u003ctable class=\"t\">\u003cthead>\u003ctr>\u003cth>Area\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Command Center\u003c/td>\u003ctd>Quick-play tiles, concept spotlight, daily challenge, local-only statistics\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Four-Card Duel\u003c/td>\u003ctd>Flagship 20-round choose-and-lock card game (vs four documented computer opponents, or two players on one device) with 3D cards, history, results dashboard and an interactive strategy analysis (see below)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Play Games\u003c/td>\u003ctd>Prisoner's Dilemma, Chicken, Stag Hunt, Battle of the Sexes, Matching Pennies, Ultimatum Game. Round history, per-round explanations, theory and comparison tabs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Strategy Lab\u003c/td>\u003ctd>Editable 2×2 and 3×3 matrices, best-response map, pure Nash search, 2×2 mixed equilibrium, Pareto view, what-if comparison, opponent arena\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Glossary and help\u003c/td>\u003ctd>Hover definitions on key terms, a searchable glossary page, first-visit tour, Help button, Beginner and Advanced modes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Learn\u003c/td>\u003ctd>21 concepts with live demos; six-module pathway with checkpoint quizzes; searchable glossary; 20-question final assessment; verified references\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AI Game Master\u003c/td>\u003ctd>Local rule-based tutor (see limitations)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Challenges\u003c/td>\u003ctd>Daily puzzle, Equilibrium Hunt, game-tree explorer, badges, demo leaderboard, journal, insights, CSV export\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Classroom Mode\u003c/td>\u003ctd>Large matrix, step-by-step choose/reveal, toggles for best responses, Nash and Pareto, simulated-vs-predicted comparison\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Docs &amp; Deployment\u003c/td>\u003ctd>This documentation inside the app, plus a live table of every opponent's decision rule\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The leaderboard is \u003cb>sample data for demonstration\u003c/b> and is labelled as such. All progress is stored in the browser's \u003ccode>localStorage\u003c/code> under the key \u003ccode>stratagem.v1\u003c/code>.\u003c/p>\u003ch3>Visual identity and navigation (v5 redesign)\u003c/h3>\u003cul>\u003cli>\u003cb>Design system.\u003c/b> \"Midnight Playground\": navy \u003ccode>#10132B\u003c/code> / indigo \u003ccode>#1A1D40\u003c/code> surfaces, violet \u003ccode>#8B7CFF\u003c/code>, cyan \u003ccode>#54E6DF\u003c/code>, coral \u003ccode>#FF817A\u003c/code>, gold \u003ccode>#FFD166\u003c/code>, mint \u003ccode>#A7F3D0\u003c/code>, warm white \u003ccode>#F7F7FC\u003c/code>; Space Grotesk headings with Inter body text; rounded, soft surfaces. Every illustration (game tile art, avatars, medals, progress rings, hero composition) is inline SVG/CSS. There are no external images and no emoji used as icons.\u003c/li>\u003cli>\u003cb>Navigation.\u003c/b> Five primary destinations: Home, Play, Strategy Lab, Learn, Challenges (the Card Duel lives under Play). The \u003cb>More\u003c/b> drawer holds the profile summary, Glossary, Game Master, Classroom mode, Docs &amp; deployment, About, and the Reduce motion / Present / Beginner-Advanced / Help settings. On phones the five destinations become a bottom tab bar.\u003c/li>\u003cli>\u003cb>Home.\u003c/b> Hero (\"Think Ahead. Outsmart the Odds.\"), a discovery strip (Quick Play, Daily Challenge, Play Against AI, Learn Through Play, each wired to a real action), \"Choose Your Challenge\" illustrated tiles for the Card Duel and the six classic games, and a short non-statistical explanation section. The Play page reuses the same game art as a compact picker.\u003c/li>\u003cli>\u003cb>Card Duel table.\u003c/b> Seats with avatars and scores on top, a bright felt reveal zone in the middle, your hand underneath, and one Menu button (sound, animation speed, reduced motion, rules, history, Strategy Lab, restart). Results read \"Match found! Red scores +1.\" or \"Different ranks! Black scores +1.\". Sound effects are synthesised with the Web Audio API, are \u003cb>off by default\u003c/b>, and use no audio files. Game scoring, privacy screen and saved-match logic are unchanged.\u003c/li>\u003cli>\u003cb>Strategy Lab.\u003c/b> Tabs are phrased as questions (\"Find the stable strategy\", \"What happens if you randomise?\") with the formal term shown beside each and as a tooltip. The Card Duel analysis (payoff table, randomise, stable strategy, simulation, your playing pattern) is a Lab tab made of expandable panels.\u003c/li>\u003cli>\u003cb>Learn.\u003c/b> The new Journey tab has seven stations (cooperation, competition, dominant strategies, Nash equilibrium, mixed strategies, zero-sum, Pareto). Each asks for a decision first, then explains, offers a mini-game with real payoffs from the engine, and ends with a knowledge check. Progress is stored per profile in this browser.\u003c/li>\u003cli>\u003cb>Achievements.\u003c/b> 14 badges, awarded only when their condition is met by real stored data: First Match, Five Games Played, Pattern Spotter (win a Card Duel against the Pattern or Adaptive opponent), Perfect Prediction (three matching rounds in a row as Red), Twenty-Round Finisher, and the earlier ones. Progress rings show partial progress.\u003c/li>\u003cli>\u003cb>Game Master.\u003c/b> Still a rule-based tutor, not a language model. It now has an illustrated avatar, context-aware suggestion chips and Card Duel answers that read the actual last round.\u003c/li>\u003cli>\u003cb>Motion.\u003c/b> Launch transition when starting a game, floating hero elements, card animations and medal reveals all respect the Reduce motion switch and \u003ccode>prefers-reduced-motion\u003c/code>.\u003c/li>\u003c/ul>\u003ch3>Technology and architecture\u003c/h3>\u003cul>\u003cli>Plain JavaScript (no framework), HTML and CSS. No runtime dependencies.\u003c/li>\u003cli>Source is split into modules in \u003ccode>src/\u003c/code> and concatenated by \u003ccode>build.js\u003c/code> into a \u003cb>single self-contained \u003ccode>dist/index.html\u003c/code>\u003c/b> with the fonts embedded as data URIs, so the page works offline.\u003c/li>\u003cli>Pure game-theory logic lives in \u003ccode>src/engine.js\u003c/code> (global \u003ccode>GT\u003c/code>) and is unit-tested in Node.\u003c/li>\u003cli>UI uses a small router (\u003ccode>go(page)\u003c/code>), page registry (\u003ccode>PAGES\u003c/code>), event delegation (\u003ccode>data-a\u003c/code>, \u003ccode>data-i\u003c/code>, \u003ccode>data-c\u003c/code> attributes) and a persisted store \u003ccode>P\u003c/code>.\u003c/li>\u003c/ul>\u003ch3>The Four-Card Duel\u003c/h3>\u003cp>\u003ci>Four Cards. Twenty Rounds. Every Choice Matters.\u003c/i>\u003c/p>\u003cp>\u003cb>Rules.\u003c/b> Four ranks: Ace, King, 2, 3. Each round both players secretly \u003cb>choose\u003c/b> one card and lock it in; neither can change a locked card; then both cards flip together. \u003cb>Red scores when the two ranks match. Black scores when they differ.\u003c/b> Exactly one player scores each round (default 1 point; the two point values are configurable). The game lasts exactly 20 rounds; the higher total wins, equal totals draw. Suits are decoration: only rank counts. There is no King-specific rule.\u003c/p>\u003cp>\u003cb>Modes.\u003c/b> \u003ci>Play vs Computer\u003c/i> (you choose Red or Black; the computer chooses independently) and \u003ci>Two players on one device\u003c/i> (Player 1 locks, a privacy screen hides everything, Player 2 locks, both cards flip together). \u003ci>Online multiplayer\u003c/i> is shown as a \u003cb>future feature and is not implemented\u003c/b>: it needs a server to relay hidden choices and this project has no backend.\u003c/p>\u003cp>\u003cb>Computer opponents (documented, none is machine learning).\u003c/b> \u003ci>Random\u003c/i>: uniform over the four ranks. \u003ci>Pattern\u003c/i>: checks whether your rank often equals the rank you played 1, 2 or 3 rounds ago (at least 3 comparisons, match rate 60% or more) and, if so, predicts your next rank (as Red it plays the prediction, as Black it avoids it); otherwise random. \u003ci>Adaptive\u003c/i>: counts your past ranks (+1 smoothing) and best-responds (Red plays your most likely rank, Black your least likely). \u003ci>Equilibrium Bot\u003c/i>: the mixed-strategy Nash equilibrium of the current rules, verified in code (25% on each rank for positive point values). Every policy sees only completed rounds, never your current choice, and the computer locks only after you have locked.\u003c/p>\u003cp>\u003cb>Single source of truth.\u003c/b> \u003ccode>DUEL.rules(cfg)\u003c/code> defines both conditions once; scoring, history, charts, explanations and analysis all derive from it. \u003ccode>DUEL.resolve\u003c/code> is idempotent per round, so a round can be scored only once, and a round cannot be revealed until both choices are locked. Animation state (\u003ccode>D.phase\u003c/code>, timers) never changes scores; Skip, Fast, Normal and reduced-motion settings only change timing.\u003c/p>\u003cp>\u003cb>Analysis (Strategy Analysis tab, recomputed live for any points you enter).\u003c/b> A 4×4 payoff matrix (Red-matching cells and Black-mismatching cells highlighted), shown either as the per-round strategic payoff (score margin, +w / −w when the points are equal) or as points scored, clearly separated from cumulative match points; a mixed-strategy lab with sliders (expected payoffs, each pure rank's expected points, equilibrium check, exploitability); a numeric proof that 25% on each rank is the equilibrium (unique when both point values are positive); a simulation tab comparing strategies; and observed-versus-theoretical tables. Theoretical equilibrium, observed frequencies and a single 20-round match are kept apart, and a 20-round result is never presented as evidence that a strategy is better. With default points the equilibrium expected totals are 5 for Red and 15 for Black: the rules favour Black.\u003c/p>\u003cp>\u003cb>Saved matches\u003c/b> (browser only) store each match's mode, side, opponent, points and choices; points are re-derived with the same engine. CSV export is shown as text to copy because the preview blocks downloads.\u003c/p>\u003cp>\u003cb>Animation.\u003c/b> Cards are real front/back components using CSS 3D transforms. Dealing, hover tilt, selection, lock-in flight to a hidden slot, a synchronized flip (both cards share one parent class so they turn in the same frame), score fly-in, collection to a discard pile and a final-round finale are all sequenced by a small scheduler. Reduced motion, Skip and Fast never skip logic.\u003c/p>\u003ch3>Accounts, guest mode and profiles\u003c/h3>\u003cp>There are three states, and the UI says which one you are in.\u003c/p>\u003cdiv class=\"tw\">\u003ctable class=\"t\">\u003cthead>\u003ctr>\u003cth>State\u003c/th>\u003cth>What it is\u003c/th>\u003cth>Sync / security\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Guest\u003c/b> (default)\u003c/td>\u003ctd>Everything works with no sign-in. Progress lives in this browser.\u003c/td>\u003ctd>None\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Local demo profile\u003c/b>\u003c/td>\u003ctd>A name and colour, \u003cb>no password\u003c/b>. Keeps its own progress in this browser.\u003c/td>\u003ctd>\u003cb>Not an account, not secure, not synced\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Account\u003c/b>\u003c/td>\u003ctd>Real sign-in through \u003cb>Supabase Auth\u003c/b>, available \u003cb>only if you configure it\u003c/b> at build time.\u003c/td>\u003ctd>Passwords go to Supabase over HTTPS and are never stored, logged or kept in app state. Progress for an account is stored per account \u003cb>on this device\u003c/b>; there is no cross-device sync in this version.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cb>Enabling real accounts.\u003c/b>\u003c/p>\u003col>\u003cli>Create a Supabase project (Authentication → Providers → Email enabled; decide whether email confirmation is required).\u003c/li>\u003cli>In Project Settings → API copy the \u003cb>Project URL\u003c/b> and the \u003cb>anon (public) key\u003c/b>.\u003c/li>\u003cli>Build with environment variables: \u003ccode>SUPABASE_URL=https://xxxx.supabase.co SUPABASE_ANON_KEY=&lt;anon key&gt; npm run build\u003c/code>. Hosts such as Netlify and Vercel take these as build environment variables.\u003c/li>\u003cli>Add your site URL under Authentication → URL Configuration so confirmation and password-reset links return to it.\u003c/li>\u003c/ol>\u003cp>Only the public URL and anon key are embedded; the anon key is public by design and protected by Supabase policies. \u003cb>Never use a service-role key\u003c/b>: the build refuses any key whose role is not \u003ccode>anon\u003c/code>. If the variables are absent the app builds in guest + demo mode and the sign-in forms are disabled with an explanation.\u003c/p>\u003cp>\u003cb>Honest testing status.\u003c/b> The auth client is tested against a \u003cb>mock GoTrue server\u003c/b> (\u003ccode>tests/auth_mock.js\u003c/code>) that implements sign-up, password sign-in, refresh, recovery and logout. That shows the client follows the protocol and handles errors, but it is \u003cb>not a test of a real Supabase project\u003c/b>, which has not been configured or tested here. Online multiplayer and cross-device sync do not exist.\u003c/p>\u003ch3>Install, run, test\u003c/h3>\u003cp>Requires Node.js 18 or newer.\u003c/p>\u003cpre class=\"code\">\u003ccode>npm install          # installs build/test tooling only (fonts, Playwright for the browser test)\nnpm run build        # writes dist/index.html\nnpm start            # serves dist/ at http://localhost:8080\nnpm run test:engine  # unit tests: game-theory engine and Four-Card Duel rules, scoring, opponents, equilibrium\nnpm run test:auth    # browser tests: guest, local demo profile, and sign-in against a MOCK auth server\nnpm test             # engine tests + browser acceptance test (needs Playwright's Chromium)\n\u003c/code>\u003c/pre>\u003cp>You can also open \u003ccode>dist/index.html\u003c/code> directly from disk. No server is required.\u003c/p>\u003ch3>Project structure\u003c/h3>\u003cpre class=\"code\">\u003ccode>src/engine.js       game rules, Nash/best-response/dominance/mixed solvers, opponent policies\nsrc/core.js         helpers, store, router, matrix component, badges, palette\nsrc/games.js        six playable games, outcome explanations, tournaments\nsrc/lab.js          Strategy Lab\nsrc/learn.js        concepts, demos, game trees\nsrc/study_data.js   learning pathway, quizzes, glossary, verified references\nsrc/study.js        Learn hub tabs, assessment engine\nsrc/classroom.js    classroom demonstration mode\nsrc/duel_engine.js  Four-Card Duel rules, scoring, probabilities, game state (pure logic)\nsrc/duel.js         Four-Card Duel UI: setup, hand, lock-in, privacy screen, reveal, animation scheduler\nsrc/duel_views.js   round history, results dashboard, saved matches, profile statistics\nsrc/duel_an.js      interactive strategy analysis: matrix, mixed-strategy lab, simulation\nsrc/auth.js         guest / local demo profile / optional Supabase sign-in, profile pages\nsrc/polish.js       tour, help, tooltips, glossary page, Beginner/Advanced mode\nsrc/hub.js          game-tile SVG art, Choose Your Challenge grid, launch transition, discovery strip, avatars, sound effects\nsrc/journey.js      Learn journey (decision-first stations), achievement medals, progress rings\nsrc/docs.js         in-app documentation page\nsrc/disclosure.js   opponent-policy disclosure and CSV export\nsrc/master.js       Game Master tutor\nsrc/challenges.js   daily puzzle, hunt, tree explorer, badges, journal, export\nsrc/home.js         home page, About page, engine self-test, boot\nsrc/style.css       design system\ndocs/               project overview, deployment guide (also embedded in the app)\ntests/              engine tests, duel tests and browser acceptance test\nbuild.js            bundler\nserve.js            dependency-free static server for dist/\n\u003c/code>\u003c/pre>\u003ch3>Mathematical assumptions and payoff conventions\u003c/h3>\u003cul>\u003cli>A matrix cell is \u003cb>(row player, column player)\u003c/b>. In the playable games the human is the row player and the opponent is the column player. In the Lab the players are called Player 1 and Player 2.\u003c/li>\u003cli>Payoffs are real numbers, including negatives and decimals. Higher is better. Numerical comparisons use a tolerance of 1e-9, so ties are detected correctly.\u003c/li>\u003cli>Payoffs used (row, column): Prisoner's Dilemma \u003ccode>CC=(3,3) CD=(0,5) DC=(5,0) DD=(1,1)\u003c/code>; Chicken \u003ccode>SS=(2,2) S/Straight=(1,4) Straight/S=(4,1) Straight/Straight=(-5,-5)\u003c/code>; Stag Hunt \u003ccode>SS=(4,4) S/H=(0,3) H/S=(3,0) HH=(3,3)\u003c/code>; Battle of the Sexes \u003ccode>OO=(3,2) FF=(2,3)\u003c/code>, mismatch \u003ccode>(0,0)\u003c/code>; Matching Pennies, you match: \u003ccode>(1,-1)\u003c/code> on a match, \u003ccode>(-1,1)\u003c/code> on a mismatch. The Ultimatum Game splits 10 coins and uses whole-number offers.\u003c/li>\u003cli>Matching Pennies is presented from the point of view of the \u003ci>matcher\u003c/i> (you). The opponent wants a mismatch.\u003c/li>\u003cli>Mixed strategies are computed for 2×2 games only. Larger matrices get pure-strategy analysis.\u003c/li>\u003c/ul>\u003ch3>How the equilibrium calculator works\u003c/h3>\u003col>\u003cli>For each column, mark the row(s) with the maximum row-player payoff (these are the row player's best responses, ties included). For each row, do the same for the column player.\u003c/li>\u003cli>A cell is a \u003cb>pure Nash equilibrium\u003c/b> if it is marked for both players. Ties mean several cells can qualify, and weak equilibria are reported.\u003c/li>\u003cli>\u003cb>Dominance:\u003c/b> strategy \u003ci>a\u003c/i> strictly dominates \u003ci>b\u003c/i> if it pays strictly more against every opponent choice; weakly if it pays at least as much everywhere and strictly more somewhere.\u003c/li>\u003cli>\u003cb>Pareto efficiency:\u003c/b> a cell is Pareto dominated if another cell gives both players at least as much and one strictly more.\u003c/li>\u003cli>\u003cb>2×2 mixed equilibrium:\u003c/b> with row payoffs \u003ci>a\u003c/i> and column payoffs \u003ci>b\u003c/i>, the column player's probability \u003ci>q\u003c/i> of playing the first column makes the row player indifferent: \u003ccode>q = (a11 − a01) / (a00 − a01 − a10 + a11)\u003c/code>. The row player's probability \u003ci>p\u003c/i> of the first row makes the column player indifferent: \u003ccode>p = (b11 − b10) / (b00 − b01 − b10 + b11)\u003c/code>. The result is a valid mixed equilibrium only if both are strictly between 0 and 1.\u003c/li>\u003cli>\u003cb>Game trees:\u003c/b> solved by backward induction. Ties at a node are broken in favour of the first listed action and flagged.\u003c/li>\u003c/ol>\u003cp>The engine is checked by \u003ccode>tests/engine.test.js\u003c/code> and by an in-app self-test (About page).\u003c/p>\u003ch3>The AI Game Master: limitations\u003c/h3>\u003cp>The Game Master is \u003cb>not an AI model\u003c/b>. It is a rule-based program that recognises intents (hints, explanations, quizzes, navigation) and fills in answers from the current game state and a fixed concept library. It cannot answer arbitrary questions and it says so. The interface labels it \u003cb>Local help\u003c/b>.\u003c/p>\u003cp>To connect a real language model safely:\u003c/p>\u003col>\u003cli>Put the model API key on \u003cb>your own server\u003c/b> (environment variable). Never ship a key in front-end code.\u003c/li>\u003cli>Expose an endpoint that accepts \u003ccode>{ message, context, mode }\u003c/code> and returns \u003ccode>{ reply }\u003c/code>. Add authentication or rate limiting and a system prompt that keeps the model on game theory.\u003c/li>\u003cli>Set \u003ccode>TUTOR_ENDPOINT\u003c/code> in \u003ccode>src/master.js\u003c/code> to that URL and rebuild. The chat header then shows \u003cb>AI-powered\u003c/b>. If the request fails the app falls back to the local tutor.\u003c/li>\u003c/ol>\u003ch3>Opponent transparency\u003c/h3>\u003cp>The Four-Card Duel's four computer opponents are documented above and in the setup screen (random, pattern, adaptive, equilibrium). Every other opponent is a short hand-written rule (fixed, biased random, or a simple reaction to your last move). The in-app Docs page lists the exact rule for every opponent, and every CSV row records the opponent's policy name and type. None learns, plans ahead or uses machine learning.\u003c/p>\u003ch3>Data export\u003c/h3>\u003cp>Challenges → Insights → \u003ci>Export my rounds (CSV)\u003c/i> gives one row per round with: match, time, game, opponent policy (id, name, type), your role, round, both strategies, both payoffs, and both cumulative totals within the match.\u003c/p>\u003ch3>Known limitations and future work\u003c/h3>\u003cul>\u003cli>Mixed equilibria only for 2×2 matrices; no n-player games; no support-enumeration for larger games.\u003c/li>\u003cli>Opponents are simple rules; no evolutionary or learning agents.\u003c/li>\u003cli>Progress is per browser (\u003ccode>localStorage\u003c/code>); there is no sync, no accounts and no shared leaderboard. Those would need a backend.\u003c/li>\u003cli>The Game Master is rule-based unless you connect your own endpoint.\u003c/li>\u003cli>Possible extensions: n×m mixed equilibria, evolutionary dynamics, Bayesian game builder, instructor dashboard with exportable class results, translations.\u003c/li>\u003c/ul>\u003ch3>Deployment\u003c/h3>\u003cp>See \u003ccode>docs/DEPLOYMENT.md\u003c/code>. In short: \u003ccode>npm run build\u003c/code>, then upload \u003ccode>dist/\u003c/code> to any static host. No server code, API key or database is needed.\u003c/p>\u003ch3>References\u003c/h3>\u003cp>See the References tab in the app (Learn → References) for the verified bibliography.\u003c/p>","overview":"\u003ch2>Project overview (for assessors)\u003c/h2>\u003ch3>The problem\u003c/h3>\u003cp>Introductory game theory is usually taught with static matrices on slides. Students can recite \"a Nash equilibrium is a mutual best response\" without ever seeing how an equilibrium moves when one payoff changes, or why a predicted equilibrium and what people (or programs) actually do can differ.\u003c/p>\u003ch3>The solution\u003c/h3>\u003cp>STRATAGEM is a playable laboratory. Every analysis on screen is computed from the payoff numbers in front of the student, so changing a number changes the best responses, equilibria and Pareto status immediately. Six classic games are playable against opponents whose rules are published. A structured pathway with quizzes and a final assessment turns exploration into a course.\u003c/p>\u003ch3>What is distinctive\u003c/h3>\u003col>\u003cli>\u003cb>Computed, not typed.\u003c/b> Equilibria, dominance and efficiency are derived live. Ties, negative payoffs and decimals are handled by an engine that is unit-tested.\u003c/li>\u003cli>\u003cb>Theory, assumption and simulation are kept apart.\u003c/b> Each claim is labelled, and Classroom Mode runs a simulation next to the theoretical prediction.\u003c/li>\u003cli>\u003cb>Honest opponents.\u003c/b> Each opponent's rule is shown in the game, in the Docs page and in every exported row. Nothing is described as \"AI\" that is not.\u003c/li>\u003cli>\u003cb>Honest tutor.\u003c/b> The Game Master is labelled as local, rule-based help. A documented adapter shows how a real model could be added securely.\u003c/li>\u003cli>\u003cb>A flagship strategy game.\u003c/b> The Four-Card Duel is a choose-and-lock card game (Red scores on a match, Black on a mismatch) whose analysis derives the 25% mixed equilibrium, exploitability and expected values from the same rules the game uses, separates theory from observed play and from a single 20-round match, and recomputes for custom points.\u003c/li>\u003cli>\u003cb>Honest accounts.\u003c/b> Guest play always works. A local demo profile is labelled as not secure. Real sign-in exists only when a Supabase project is configured, and its testing status is stated.\u003c/li>\u003cli>\u003cb>Runs anywhere.\u003c/b> One static file, works offline, stores progress only in the student's browser.\u003c/li>\u003c/ol>\u003ch3>Learning outcomes\u003c/h3>\u003cp>After completing the pathway a student can:\u003c/p>\u003col>\u003cli>Represent a strategic situation as players, strategies and payoffs, and read a payoff matrix.\u003c/li>\u003cli>Find best responses and identify dominant and dominated strategies.\u003c/li>\u003cli>Locate pure Nash equilibria and explain why equilibrium and efficiency can disagree.\u003c/li>\u003cli>Compute a 2×2 mixed equilibrium from indifference.\u003c/li>\u003cli>Solve a game tree by backward induction and judge whether a threat is credible.\u003c/li>\u003cli>Explain how repetition, incomplete information and rule design change predictions.\u003c/li>\u003cli>Distinguish a theoretical prediction from a simulated outcome and from a model assumption.\u003c/li>\u003c/ol>\u003ch3>Assessment\u003c/h3>\u003cp>Each of the six modules has a three-question checkpoint with an explanation for every option. The final assessment has 20 questions (concepts, matrix interpretation, Nash identification, scenarios) with a 70% pass mark. Results are stored locally and are not collected.\u003c/p>\u003ch3>Honest scope\u003c/h3>\u003cp>STRATAGEM is a teaching aid, not a research solver. Mixed equilibria are computed for 2×2 games only. The leaderboard shows labelled sample data. Opponents are simple rules. See the README for known limitations.\u003c/p>","deploy":"\u003ch2>Deployment\u003c/h2>\u003cp>STRATAGEM is a \u003cb>static site\u003c/b>: one HTML file plus nothing else. It needs \u003cb>no backend, no database and no API key\u003c/b>. The only optional external dependency is a server you would build yourself if you want a real language-model tutor (see the README).\u003c/p>\u003ch3>Local commands\u003c/h3>\u003cpre class=\"code\">\u003ccode>npm install\nnpm run build     # produces dist/index.html (fonts embedded, works offline)\nnpm start         # http://localhost:8080\nnpm test          # engine unit tests + browser acceptance test\n\u003c/code>\u003c/pre>\u003ch3>Any static host\u003c/h3>\u003cp>Upload the contents of \u003ccode>dist/\u003c/code>. Nothing else is required.\u003c/p>\u003ch4>Netlify\u003c/h4>\u003cul>\u003cli>Drag-and-drop \u003ccode>dist/\u003c/code> at app.netlify.com/drop, or connect the repository.\u003c/li>\u003cli>Build command \u003ccode>npm run build\u003c/code>, publish directory \u003ccode>dist\u003c/code> (already set in \u003ccode>netlify.toml\u003c/code>).\u003c/li>\u003c/ul>\u003ch4>Vercel\u003c/h4>\u003cul>\u003cli>Import the repository. \u003ccode>vercel.json\u003c/code> sets the build command and output directory.\u003c/li>\u003cli>CLI: \u003ccode>npx vercel --prod\u003c/code>, after \u003ccode>npx vercel login\u003c/code>.\u003c/li>\u003c/ul>\u003ch4>GitHub Pages\u003c/h4>\u003cul>\u003cli>Push the repository, then either publish the \u003ccode>dist/\u003c/code> folder to a \u003ccode>gh-pages\u003c/code> branch, or use a GitHub Actions workflow that runs \u003ccode>npm ci &amp;&amp; npm run build\u003c/code> and uploads \u003ccode>dist/\u003c/code> with \u003ccode>actions/upload-pages-artifact\u003c/code> and \u003ccode>actions/deploy-pages\u003c/code>.\u003c/li>\u003cli>Project pages are served from a sub-path. The app uses no absolute URLs, so this works unchanged.\u003c/li>\u003c/ul>\u003ch4>Cloudflare Pages\u003c/h4>\u003cul>\u003cli>Build command \u003ccode>npm run build\u003c/code>, output directory \u003ccode>dist\u003c/code>.\u003c/li>\u003c/ul>\u003ch3>Optional: real accounts (Supabase)\u003c/h3>\u003cp>Set \u003ccode>SUPABASE_URL\u003c/code> and \u003ccode>SUPABASE_ANON_KEY\u003c/code> as \u003cb>build\u003c/b> environment variables (Netlify: Site settings → Environment variables; Vercel: Project settings → Environment Variables) and rebuild. Use only the public anon key; the build fails if the key's role is not \u003ccode>anon\u003c/code>. Without them the site works in guest and local-demo-profile mode. Add the deployed URL to Supabase → Authentication → URL Configuration. The auth client has only been tested against a mock server, so verify sign-up, sign-in and password reset on your own project before relying on them.\u003c/p>\u003ch3>Verifying a deployment\u003c/h3>\u003cp>After deploying, open the public URL and check: the home page loads; each of the six games plays a round; the Lab updates equilibria when you edit a number; Learn → Final assessment starts; Challenges → Insights shows CSV text. Run \u003ccode>BASE_URL=https://your-site npm run test:browser\u003c/code> to run the same checks automatically against the live site.\u003c/p>\u003ch3>Dependencies and configuration\u003c/h3>\u003cdiv class=\"tw\">\u003ctable class=\"t\">\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Needed?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Backend server\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Database\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>API key\u003c/td>\u003ctd>No (only if you add your own tutor endpoint, which must keep the key on the server)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Environment variables\u003c/td>\u003ctd>None\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Third-party network calls at run time\u003c/td>\u003ctd>None (fonts are embedded)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"};
const DD = { tab: 'readme' };
const DTABS = [['readme', 'README'], ['overview', 'Project overview'], ['deploy', 'Deployment'], ['opp', 'Opponent policies'], ['data', 'Data export']];
function docBody() {
  if (DD.tab === 'opp') return `<div class="card"><h2 style="font-size:18px">How every opponent decides</h2><p class="sm muted" style="margin:6px 0 10px">${esc(POLICY_NOTE)}</p>${policyTable(false)}<p class="xs muted" style="margin-top:8px">This table is generated from the same objects the game code runs, so it cannot drift from the implementation. Policy type words: <b>fixed</b> = same move every round; <b>random</b> = chooses with a stated probability using a seeded pseudo-random generator; <b>reactive rule</b> = depends on your previous move(s) through a short written rule; <b>scripted pattern</b> = follows a fixed sequence; <b>fixed threshold</b> = accepts an offer if it is at least a set amount.</p></div>`;
  if (DD.tab === 'data') return `<div class="card"><h2 style="font-size:18px">CSV export format</h2><p class="sm muted" style="margin:6px 0 10px">Challenges → Insights → Export my rounds. One row per round, stored only in your browser.</p><div class="tw"><table class="t"><thead><tr><th>Column</th><th>Meaning</th></tr></thead><tbody>${[['match', 'Match number (a new match starts at round 1)'], ['time', 'ISO timestamp'], ['game', 'pd, chicken, stag, bos, mp or ult'], ['opponent_policy_id / _name / _type', 'Which written rule the opponent followed, and what kind of rule it is'], ['your_role', 'row player, or proposer / responder in the Ultimatum Game'], ['round', 'Round within the match, from 1'], ['your_strategy, opponent_strategy', 'Moves played (Ultimatum: offers and Accept/Reject)'], ['your_payoff, opponent_payoff', 'Payoffs this round'], ['your_cumulative, opponent_cumulative', 'Running totals within the match, including this round']].map(r => `<tr><td class="mono sm">${esc(r[0])}</td><td class="sm muted">${esc(r[1])}</td></tr>`).join('')}</tbody></table></div><button class="btn pri" style="margin-top:10px" data-a="gochtab">Open the export</button></div>`;
  return `<div class="card doc">${DOCS[DD.tab] || '<p>Documentation not available.</p>'}</div>`;
}
PAGES.docs = () => `<div class="ph"><div><h1>Docs &amp; Deployment</h1><p>The project documentation, shipped inside the app so it works offline. The same files are in the repository.</p></div></div><div class="tabs" role="tablist" aria-label="Documentation" style="margin-bottom:14px">${DTABS.map(t => `<button role="tab" data-a="dtab" data-t="${t[0]}" aria-selected="${DD.tab === t[0]}">${t[1]}</button>`).join('')}</div>${docBody()}`;
ACT.dtab = el => { DD.tab = el.dataset.t; render(false); };
ACT.gochtab = () => { go('challenges'); setChTab('insights'); };

/* ================= GAME MASTER: local rule-based tutor with an adapter for a future server-side model ================= */
// To connect a real language model later, set TUTOR_ENDPOINT to a server-side URL that holds the API key.
// The key must never be placed in this file. The endpoint receives {message, context, mode} and returns {reply}.
const TUTOR_ENDPOINT = '';
const T = { msgs: [], mode: 'normal', hints: {}, quiz: null, init: false };
const QUICK = ['I’m new here. Where should I start?', 'Explain Nash equilibrium using this game.', 'Why was my strategy unsuccessful?', 'Give me a hint, not the answer.', 'Which game should I play next?', 'Explain the payoff matrix.'];
const ORDER = ['pd', 'chicken', 'stag', 'bos', 'mp', 'ult'];
const WHYNEXT = { pd: 'It is the clearest example of a dominant strategy leading to a worse shared outcome.', chicken: 'It has no dominant strategy and two equilibria, a good contrast with the Prisoner’s Dilemma.', stag: 'It shows how trust and risk decide which equilibrium players reach.', bos: 'It mixes coordination with conflict over which equilibrium to pick.', mp: 'It has no pure equilibrium, so you meet mixed strategies.', ult: 'It is sequential and shows how theory and human fairness norms can differ.' };
const ELI = {
  nash: 'Imagine you and a friend each pick something at the same time. It is a “nobody wants to change” moment: if you both look at the situation and think “if I switched on my own, I would not do better”, you are in a Nash equilibrium. It is stable, but not always the best thing for both of you.',
  dominant: 'A dominant strategy is a choice that is better for you no matter what your friend picks. Like choosing the sandwich that tastes best whether or not they have chips.',
  mixed: 'In a guessing game like rock-paper-scissors, if you always pick the same thing your friend learns it. So you mix it up on purpose, so nobody can guess you.',
  pareto: 'A situation is Pareto efficient when you cannot make anyone happier without making someone else less happy.',
  br: 'Your best response is the best thing you can do given what the other person is doing right now.',
  backward: 'Start at the end of the story and work backward, like solving a maze from the finish line. You figure out the last choice first, then the one before it.',
  repeated: 'If you will play again tomorrow, being mean today has a price, because the other person remembers.',
  credible: 'A threat only works if people believe you would do it. If doing it would hurt you too, nobody believes you, unless you have locked yourself in.',
  zero: 'In a zero-sum game, what one person wins the other loses, like splitting one pizza. In non-zero-sum games, everyone can win or lose together.',
};
function chipList() {
  if (S.page === 'duel' && D.g) return ['Why did Black win this round?', 'What should I try next?', 'Explain this strategy simply.', 'Challenge me with a harder scenario.'];
  if (S.page === 'play') return ['Why was my strategy unsuccessful?', 'Give me a hint, not the answer.', 'Explain this strategy simply.', 'What should I try next?'];
  if (S.page === 'lab') return ['Explain Nash equilibrium using this game.', 'Explain the payoff matrix.', 'Explain this strategy simply.', 'Challenge me with a harder scenario.'];
  return ['I’m new here. Where should I start?', 'What should I try next?', 'Explain this strategy simply.', 'Challenge me with a harder scenario.'];
}
function duelCounts() {
  if (typeof D === 'undefined' || !D.g || !D.g.rounds.length) return null;
  const g = D.g, who = g.mode === 'cpu' ? g.role : 'red', c = {}; DUEL.RANKS.forEach(r => c[r] = 0); g.rounds.forEach(r => c[r[who]]++);
  const n = g.rounds.length, top = DUEL.RANKS.reduce((a, b) => c[b] > c[a] ? b : a);
  return { c, n, top, who };
}
function duelWhy() {
  if (typeof D === 'undefined' || !D.g || !D.g.rounds.length) return { html: '<p>Play a round of the Card Duel first, then ask me again and I will explain it from the actual cards.</p>', acts: [{ l: 'Open the Card Duel', go: 'duel' }] };
  const r = D.g.rounds[D.g.rounds.length - 1];
  return { html: `<p>Round ${r.n}: Red played <b>${esc(rankName(r.red))}</b> and Black played <b>${esc(rankName(r.black))}</b>. ${r.match ? 'The ranks matched, so <b>Red</b> scored.' : 'The ranks were different, so <b>Black</b> scored.'}</p><p class="sm muted">Only the rank counts, never the suit. Black scores whenever the ranks differ, which is 3 of the 4 equally likely pairings for a random opponent.</p>` };
}
function tryNext() {
  const d = duelCounts();
  if (S.page === 'duel' && d) { const pct = Math.round(d.c[d.top] / d.n * 100); return { html: `<p>So far you played <b>${esc(rankName(d.top))}</b> ${d.c[d.top]} of ${d.n} times (${pct}%).</p><p>${d.n >= 4 && pct > 40 ? 'That is a lean an adaptive opponent can use. Try spreading your choices more evenly.' : 'That looks nicely mixed. Keep it unpredictable: no card should show up much more than about a quarter of the time.'}</p>` }; }
  return localReply('which game should i play next');
}
function strategySimple() {
  if (S.page === 'duel') return { html: '<p>Think of the Card Duel as a guessing game. Red wants the cards to <b>match</b>; Black wants them to be <b>different</b>. If you repeat a habit, your opponent can learn it. The safest defence is to pick each card about equally often, in no pattern.</p>' };
  const m = T.mode; T.mode = 'eli'; const h = explainNashCtx(); T.mode = m; return { html: h };
}
function harderScenario() {
  const next = ORDER.slice().reverse().find(g => g !== 'ult' && !(P.matches[g] > 0 && GT.GAMES[g].difficulty === 'Beginner'));
  return { html: `<p>Try this: play the <b>Card Duel</b> as Red against the <b>Equilibrium Bot</b>. It mixes all four cards evenly, so you cannot out-guess it. Then see how far you stay from the expected score.</p><p class="sm muted">Or test yourself on today’s Daily Challenge.</p>`, acts: [{ l: 'Open the Card Duel', go: 'duel' }, { l: 'Daily Challenge', go: 'challenges' }, ...(next ? [{ l: 'Play ' + GT.GAMES[next].short, game: next }] : [])] };
}
function ctxInfo() {
  if (S.page === 'duel') return { label: 'Card Duel' + (typeof D !== 'undefined' && D.g ? ` · round ${Math.min(D.g.rounds.length + 1, DUEL.ROUNDS)}/${DUEL.ROUNDS}` : ''), game: null };
  if (S.page === 'play') { const g = sg(curGame), G = GT.GAMES[curGame]; if (curGame === 'ult') return { label: `${G.name} · round ${Math.min(ULT.round + 1, ULT.len)}/${ULT.len}`, game: curGame }; return { label: `${G.name} · ${g.done ? 'match complete' : 'round ' + Math.min(g.round + 1, g.len) + '/' + g.len}`, game: curGame }; }
  if (S.page === 'lab') return { label: 'Strategy Lab · ' + (LAB_TABS.find(t => t.id === L.tab) || {}).label, game: null };
  if (S.page === 'learn') { const c = CONCEPTS.find(x => x.id === LS.sel); return { label: 'Learn · ' + (c ? c.title : ''), game: c ? c.game : null, concept: c }; }
  if (S.page === 'challenges') return { label: 'Challenges · ' + ((typeof CH !== 'undefined' && CH.tab) || 'daily'), game: null };
  const pm = PAGES_META.find(p => p.id === S.page); return { label: pm ? pm.label : 'Account', game: null };
}
function plainNE(M, eli) {
  const an = GT.analyze(M), lines = [];
  an.ne.forEach(([i, j]) => {
    const e = GT.explainCell(M, i, j), alt1 = e.p1.filter(x => x.idx !== i).map(x => `${x.name} → ${fmt(x.payoff)}`).join(', '), alt2 = e.p2.filter(x => x.idx !== j).map(x => `${x.name} → ${fmt(x.payoff)}`).join(', ');
    lines.push(`<li><b>(${esc(M.rows[i])}, ${esc(M.cols[j])})</b>: you get ${fmt(e.cur[0])}. If you alone switched you would get ${esc(alt1)}, so you stay. The opponent gets ${fmt(e.cur[1])} and switching alone would give them ${esc(alt2)}, so they stay too.</li>`);
  });
  return { an, html: lines.length ? `<ul>${lines.join('')}</ul>` : '' };
}
function mathNE(M) {
  const an = GT.analyze(M), out = [];
  an.ne.forEach(([i, j]) => { const e = GT.explainCell(M, i, j); out.push(`<li class="mono">(${esc(M.rows[i])}, ${esc(M.cols[j])}): u₁ = ${fmt(e.cur[0])} ≥ ${e.p1.filter(x => x.idx !== i).map(x => fmt(x.payoff)).join(', ')} and u₂ = ${fmt(e.cur[1])} ≥ ${e.p2.filter(x => x.idx !== j).map(x => fmt(x.payoff)).join(', ')}</li>`); });
  const mx = M.rows.length === 2 && M.cols.length === 2 ? GT.mixed2x2(M) : null;
  return `<ul>${out.join('')}</ul>${mx && mx.valid ? `<p class="mono">Mixed: p* = ${fmt(mx.p, 3)} (P1 plays ${esc(M.rows[0])}), q* = ${fmt(mx.q, 3)} (P2 plays ${esc(M.cols[0])}).</p>` : ''}`;
}
function explainNashCtx() {
  const ci = ctxInfo(), id = ci.game && ci.game !== 'ult' ? ci.game : (S.page === 'lab' ? null : 'pd'), M = id ? GT.GAMES[id].M : L.M, name = id ? GT.GAMES[id].name : 'the matrix in your Strategy Lab';
  const pn = plainNE(M), an = pn.an;
  if (T.mode === 'math') return `<p>Nash condition for ${esc(name)}: uᵢ(sᵢ*, s₋ᵢ*) ≥ uᵢ(sᵢ, s₋ᵢ*) for all i, sᵢ.</p>${an.ne.length ? `<p>Pure equilibria:</p>${mathNE(M)}` : '<p>No pure equilibrium.</p>' + mathNE(M)}`;
  if (T.mode === 'eli') return `<p>${esc(ELI.nash)}</p>${an.ne.length ? `<p>In <b>${esc(name)}</b>, that “nobody wants to change” spot is ${an.ne.map(([i, j]) => `<b>(${esc(M.rows[i])}, ${esc(M.cols[j])})</b>`).join(' and ')}.</p>` : `<p>In <b>${esc(name)}</b> there is no spot where nobody wants to change, so players have to mix things up.</p>`}`;
  return `<p>A Nash equilibrium is a cell where neither player gains by switching alone. In <b>${esc(name)}</b>:</p>${an.ne.length ? pn.html : '<p>No cell passes the test. Whatever pure choice one player makes, the other can respond so that someone wants to switch. The equilibrium is mixed.</p>'}<p class="xs">Try it yourself: click any cell in the matrix to run this test.</p>`;
}
function whyUnsuccessful() {
  const lastR = P.rounds[P.rounds.length - 1]; if (!lastR) return { html: '<p>You have not played a round yet. Play a few rounds of any game, then ask me again and I will look at your actual choices.</p>', acts: [{ l: 'Play the Prisoner’s Dilemma', game: 'pd' }] };
  const id = lastR.game;

/* ---------- insights & export ---------- */
function insights() {
  const R = P.rounds, n = R.length; if (n < 20) return null;
  const rate = (arr, f) => arr.length ? arr.filter(f).length / arr.length : null, out = [];
  const pd = R.filter(r => r.game === 'pd'), ch = R.filter(r => r.game === 'chicken'), st = R.filter(r => r.game === 'stag');
  if (pd.length >= 5) { const c = rate(pd, r => r.you === 'Cooperate'); out.push({ l: 'Cooperation (Prisoner’s Dilemma)', v: c, t: c > .65 ? 'You usually cooperate.' : c < .35 ? 'You usually defect.' : 'You mix cooperation and defection.' }); const afterD = [], afterC = []; for (let i = 1; i < pd.length; i++) if (pd[i].round > 1 && pd[i - 1].game === 'pd') (pd[i - 1].them === 'Defect' ? afterD : afterC).push(pd[i].you === 'Cooperate'); if (afterD.length >= 3 && afterC.length >= 3) { const a = afterC.filter(Boolean).length / afterC.length, b = afterD.filter(Boolean).length / afterD.length; out.push({ l: 'Reciprocity: cooperating after their cooperation vs after their defection', v: a, v2: b, t: a - b > .3 ? 'You tend to answer in kind.' : 'You respond little to what they did last round.' }); } }
  if (ch.length >= 5) { const s = rate(ch, r => r.you === 'Stay Straight'); out.push({ l: 'Risk-taking (Chicken: Stay Straight rate)', v: s, t: s > .6 ? 'You often hold the line, accepting crash risk.' : s < .35 ? 'You usually avoid the crash.' : 'You balance risk and caution.' }); }
  if (st.length >= 5) { const s = rate(st, r => r.you === 'Hunt Stag'); out.push({ l: 'Trust (Stag Hunt: Hunt Stag rate)', v: s, t: s > .6 ? 'You usually go for the shared prize.' : s < .35 ? 'You usually take the safe option.' : 'You split between trust and safety.' }); }
  let same = 0, tot = 0; for (let i = 1; i < R.length; i++) if (R[i].game === R[i - 1].game && R[i].round > 1) { tot++; if (R[i].you === R[i - 1].you) same++; } if (tot >= 8) out.push({ l: 'Consistency (repeating your previous move)', v: same / tot, t: same / tot > .7 ? 'Your play is steady, and so more predictable.' : same / tot < .4 ? 'You switch often, which is harder to predict.' : 'You mix steadiness with change.' });
  return out;
}

/* ---- tooltips on game-theory terms (first occurrence per page, text only, never inside controls) ---- */
const TIPS = [
  [/\bNash equilibri(?:um|a)\b/i, 'Nash equilibrium'], [/\bdominant strateg(?:y|ies)\b/i, 'Dominant strategy'], [/\bdominated\b/i, 'Dominated strategy'], [/\bbest responses?\b/i, 'Best response'],
  [/\bPareto[- ]efficien(?:t|cy)\b/i, 'Pareto efficiency'], [/\bmixed[- ]strateg(?:y|ies)\b/i, 'Mixed strategy'], [/\bbackward induction\b/i, 'Backward induction'], [/\bsubgame[- ]perfect\b/i, 'Subgame-perfect equilibrium'],
  [/\bzero-sum\b/i, 'Zero-sum game'], [/\bcredible threats?\b/i, 'Credible threat'], [/\bexpected payoffs?\b/i, 'Expected payoff'], [/\bTit-for-Tat\b/, 'Tit-for-Tat'], [/\bpayoff matrix\b/i, 'Normal form'], [/\bindifferen(?:t|ce)\b/i, 'Indifference'], [/\brisk dominan(?:t|ce)\b/i, 'Risk dominance'],
];
const tipText = n => { const g = GLOSS.find(x => x[0] === n); return g ? g[1] : ''; };
function autoTips(root) {
  if (!root) return; const done = new Set(), skip = 'button,a,textarea,select,input,summary,svg,.tt,.chip,th,h1,h2,h3,h4,label,code,.mono,.lbl,kbd,.cell,.opt,[data-notip],.seg,.tabs,.hrow,.zone,.d-top,.sbox';
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.nodeValue.trim().length > 12 && n.parentElement && !n.parentElement.closest(skip)) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT }), nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    for (const [re, name] of TIPS) {
      if (done.has(name)) continue; const m = re.exec(n.nodeValue); if (!m) continue;
      const tx = tipText(name); if (!tx) continue; done.add(name);
      const a = n.nodeValue.slice(0, m.index), b = n.nodeValue.slice(m.index + m[0].length), s = document.createElement('span');
      s.className = 'tt'; s.tabIndex = 0; s.setAttribute('data-tip', tx); s.setAttribute('role', 'note'); s.textContent = m[0];
      const p = n.parentNode; p.insertBefore(document.createTextNode(a), n); p.insertBefore(s, n); n.nodeValue = b; break;
    }
  });
}
function countUp(el) { const n = +el.dataset.count; if (!motionOn() || !(n > 0)) return; const T0 = performance.now(); const f = now => { const k = Math.min(1, (now - T0) / 700); el.textContent = Math.round(n * (1 - Math.pow(1 - k, 3))); if (k < 1 && el.isConnected) requestAnimationFrame(f); else el.textContent = n; }; el.textContent = 0; requestAnimationFrame(f); }
function stagger(sel) { document.querySelectorAll(sel).forEach((c, i) => { c.style.setProperty('--i', Math.min(i, 12)); c.classList.add('stg-in'); }); }
function postRender() {

/* ---------- self test (runs the same engine the app uses) ---------- */
function runSelfTest() {
  const T = [], ok = (n, c) => T.push({ n, ok: !!c });
  const key = M => JSON.stringify(GT.pureNash(M));
  ok('Prisoner’s Dilemma: unique equilibrium (Defect, Defect)', key(GT.GAMES.pd.M) === '[[1,1]]');
  ok('Chicken: two pure equilibria (Swerve, Stay) and (Stay, Swerve)', key(GT.GAMES.chicken.M) === '[[0,1],[1,0]]');
  ok('Stag Hunt: two pure equilibria on the diagonal', key(GT.GAMES.stag.M) === '[[0,0],[1,1]]');
  ok('Battle of the Sexes: two pure equilibria on the diagonal', key(GT.GAMES.bos.M) === '[[0,0],[1,1]]');
  ok('Matching Pennies: no pure equilibrium', key(GT.GAMES.mp.M) === '[]');
  ok('All-tied 2×2 game: all 4 cells are equilibria', GT.pureNash(GT.mk(['a', 'b'], ['c', 'd'], [[[0, 0], [0, 0]], [[0, 0], [0, 0]]])).length === 4);
  const neg = GT.mk(['a', 'b'], ['c', 'd'], [[[-1, -1], [-3, 0]], [[0, -3], [-2, -2]]]); ok('Negative payoffs: (b, d) is the only equilibrium', key(neg) === '[[1,1]]');
  const dec = GT.mk(['a', 'b'], ['c', 'd'], [[[1.5, 1.5], [0.5, 2.25]], [[2.25, 0.5], [1.25, 1.25]]]); ok('Decimal payoffs handled', key(dec) === '[[1,1]]');
  const mp = GT.mixed2x2(GT.GAMES.mp.M); ok('Matching Pennies mixed equilibrium is 1/2 and 1/2', Math.abs(mp.p - .5) < 1e-9 && Math.abs(mp.q - .5) < 1e-9);
  const ch = GT.mixed2x2(GT.GAMES.chicken.M); ok('Chicken mixed equilibrium: each stays straight with prob. 1/4', Math.abs(ch.p - .75) < 1e-9);
  ok('Expected payoff at Matching Pennies equilibrium is 0', Math.abs(GT.expected(GT.GAMES.mp.M, .5, .5).u1) < 1e-9);
  const pd = GT.analyze(GT.GAMES.pd.M); ok('Pareto: (Defect, Defect) is dominated, (Cooperate, Cooperate) is efficient', !pd.cells[1][1].pareto && pd.cells[0][0].pareto);
  const dom = GT.dominance(GT.GAMES.pd.M); ok('Defect is strictly dominant for both players in the Prisoner’s Dilemma', dom.dominant1[0].s === 1 && dom.dominant1[0].strict && dom.dominant2[0].s === 1);
  ok('Stag Hunt has no dominant strategy', GT.dominance(GT.GAMES.stag.M).dominant1.length === 0);
  ok('Backward induction on the entry game gives (2, 2)', JSON.stringify(GT.solveTree(TREES.entry.root).payoff) === '[2,2]');
  ok('Centipede game: backward induction gives (2, 0)', JSON.stringify(GT.solveTree(TREES.centipede.root).payoff) === '[2,0]');
  const nf = GT.treeToNormal(TREES.entry.root); ok('Entry game has a second, non-subgame-perfect Nash equilibrium', GT.pureNash(nf).length === 2);
  const rd = riskDom(GT.GAMES.stag.M); ok('Stag Hunt (hare = 3): Hare/Hare is risk dominant', rd.rd === 1);
  ok('Iterated elimination reaches (Up, Left) on the 3×3 example', (() => { const s = iesds(DOM3), m = s[s.length - 1].M; return m.rows[0] === 'Up' && m.cols[0] === 'Left'; })());
  ok('Prisoner’s Dilemma payoffs match the brief (3,3), (0,5), (5,0), (1,1)', JSON.stringify(GT.GAMES.pd.M.pay) === '[[[3,3],[0,5]],[[5,0],[1,1]]]');
  return T;
}
const AB = { tests: null };
ACT.selftest = () => { AB.tests = runSelfTest(); render(); };
ACT.presentbtn = () => togglePresent();
PAGES.about = () => `<div class="ph"><div><h1>About the Project</h1><p>STRATAGEM is an interactive learning platform for an academic game theory project. Everything runs in your browser. Nothing is sent anywhere.</p></div><button class="btn am" data-a="presentbtn">${icon('screen')}Classroom presentation mode</button></div>
<div class="split-eq"><div class="col"><div class="card"><h3>What you can do here</h3><ul class="sm muted" style="margin:6px 0 0 16px;padding:0"><li><b>Play</b> six games with real rules and AI opponents.</li><li><b>Experiment</b> in the Strategy Lab: edit payoffs and watch equilibria update.</li><li><b>Learn</b> 21 concepts, each with a demo and a knowledge check.</li><li><b>Ask</b> the Game Master for hints and explanations.</li><li><b>Practice</b> with daily puzzles, an Equilibrium Hunt and game trees.</li></ul></div>
<div class="card"><h3>How the math is done</h3><ul class="sm muted" style="margin:6px 0 0 16px;padding:0"><li>Equilibria, best responses, dominance and Pareto status are computed from the payoff numbers every time. None are typed in.</li><li>A pure Nash equilibrium needs each player’s payoff to be at least as large as any alternative against the other’s choice, so ties create extra equilibria.</li><li>2×2 mixed equilibria solve the opponent’s indifference condition. Expected payoffs use the exact probabilities you set.</li><li>Simulated frequencies are labelled as empirical and are never fed back into theory numbers.</li></ul></div>
<div class="card"><div class="sec-h"><h3>Engine self-test</h3><button class="btn sm pri" data-a="selftest">${icon('check')}Run checks</button></div>${AB.tests ? `<table class="t"><tbody>${AB.tests.map(t => `<tr><td>${t.ok ? '<b class="ok">PASS</b>' : '<b class="red">FAIL</b>'}</td><td class="sm">${esc(t.n)}</td></tr>`).join('')}</tbody></table><p class="sm" style="margin-top:6px"><b>${AB.tests.filter(t => t.ok).length}/${AB.tests.length}</b> checks passed, using the same engine as the games and lab.</p>` : '<p class="sm muted">Runs known examples (equilibria of each game, ties, negative and decimal payoffs, mixed strategies, backward induction) against the live engine.</p>'}</div></div>
<div class="col"><div class="card"><h3>Assumptions and limits</h3><ul class="sm muted" style="margin:6px 0 0 16px;padding:0"><li><b>Opponents are simple programs.</b> Each AI policy is described on its card, and the description is what the code does. They are not learning models.</li><li><b>Payoffs are teaching values</b> and represent utility. The Stag Hunt uses a safe hare payoff of 3 so that risk dominance and payoff dominance differ. The brief’s version (hare = 2) is in the Strategy Lab presets, where the two tie.</li><li><b>Repeated-game outcomes</b> depend on the opponent’s rule, the horizon and the incentives. A finite match does not prove what happens in theory.</li><li><b>Ultimatum results</b> depend on the responder policies, which are modelling choices, not measured behavior.</li><li><b>Insights</b> are informal summaries of your play here, not psychological tests.</li><li><b>Local only.</b> Progress is saved in this browser. The leaderboard rows marked Sample are made-up demonstration data.</li><li><b>No AI model.</b> The Game Master is a rule-based tutor. It can be connected to a server-side model later.</li></ul></div>
<div class="card"><h3>Possible future extensions</h3><p class="sm muted" style="margin-top:6px">These need a backend and are not implemented: accounts, online multiplayer, a shared leaderboard, cloud sync, and a language-model tutor behind a secure endpoint.</p></div>
<div class="card"><h3>Accessibility</h3><p class="sm muted" style="margin-top:6px">All controls work with the keyboard (matrix cells too). Outcomes use text tags as well as color. A Reduce motion switch and your system setting both limit animation. Press Ctrl/⌘+K to search anything.</p></div>
<div class="card"><h3>References &amp; further reading</h3>${refsHTML()}</div></div></div>`;
